<g transform="translate(1026.0,742.5) rotate(-90)">
<text x="0.0" y="0.0" class="dimt" text-anchor="middle" style="paint-order:stroke;stroke:#fff;stroke-width:6;stroke-linejoin:round">4" MIN. LAP</text>
</g>
<path d="M733.0,949.0 l-13,-12 l26,0 z" fill="#000"/>
<text x="753.0" y="941.0" class="dimt" text-anchor="start" style="paint-order:stroke;stroke:#fff;stroke-width:6;stroke-linejoin:round">FINISH GRADE - SEE CIVIL</text>
<path d="M1237.0,781.0 l-13,-12 l26,0 z" fill="#000"/>
<text x="1257.0" y="773.0" class="dimt" text-anchor="start" style="paint-order:stroke;stroke:#fff;stroke-width:6;stroke-linejoin:round">T.O. FOUNDATION</text>
<path d="M929.0,333.0 L1083.0,333.0" class="lead" marker-end="url(#dot)"/>
<rect x="897.0" y="314.0" width="64" height="38" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="929.0" y="341.0" class="tag" text-anchor="middle">W1</text>
<path d="M1321.0,1117.0 L1181.0,1117.0" class="lead" marker-end="url(#dot)"/>
<rect x="1289.0" y="1098.0" width="64" height="38" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="1321.0" y="1125.0" class="tag" text-anchor="middle">W2</text>
<path d="M1321.0,501.0 L1293.0,587.8" class="lead" marker-end="url(#dot)"/>
<rect x="1289.0" y="482.0" width="64" height="38" fill="#fff" stroke="#000" stroke-width="2.2"/>
<text x="1321.0" y="509.0" class="tag" text-anchor="middle">F1</text>
<text x="588.0" y="696.0" class="n" text-anchor="end">HOLD THE FACE OF THE WALL CI FLUSH WITH THE</text>
<text x="588.0" y="718.0" class="n" text-anchor="end">FACE OF THE FOUNDATION INSULATION - ONE</text>
<text x="588.0" y="740.0" class="n" text-anchor="end">PLANE, NO LEDGE TO CATCH WATER.</text>
<path d="M598.0,689.0 L628.0,689.0 L1069.0,725.0" class="lead" marker-end="url(#arw)"/>
<rect x="575" y="766.0" width="13" height="13" fill="#000"/>
<text x="566.0" y="778.0" class="n" text-anchor="end">Z-FLASHING - UP BEHIND THE WRB 4" MIN., OUT</text>
<text x="566.0" y="800.0" class="n" text-anchor="end">OVER THE TOP OF THE FOUNDATION INSULATION,</text>
<text x="566.0" y="822.0" class="n" text-anchor="end">HEMMED DRIP 1/2" PAST THE PROTECTION BOARD.</text>
<path d="M598.0,771.0 L628.0,771.0 L1060.6,788.0" class="lead" marker-end="url(#arw)"/>
<rect x="575" y="848.0" width="13" height="13" fill="#000"/>
<text x="566.0" y="860.0" class="n" text-anchor="end">INSECT SCREEN AT THE BASE OF THE RAINSCREEN</text>
<text x="566.0" y="882.0" class="n" text-anchor="end">CAVITY - LEAVE THE CAVITY OPEN TO DRAIN.</text>
<path d="M598.0,853.0 L628.0,853.0 L1063.4,837.0" class="lead" marker-end="url(#arw)"/>
<text x="588.0" y="920.0" class="n" text-anchor="end">BOTTOM OF SIDING 8" MIN. ABOVE FINISH GRADE</text>
<text x="588.0" y="942.0" class="n" text-anchor="end">AT THE HIGHEST GRADE POINT ALONG THIS WALL.</text>
<text x="588.0" y="964.0" class="n" text-anchor="end">NO MULCH OR PLANTING ABOVE THIS LINE.</text>
<path d="M598.0,913.0 L628.0,913.0 L1052.2,837.0" class="lead" marker-end="url(#arw)"/>
<rect x="575" y="990.0" width="13" height="13" fill="#000"/>
<text x="566.0" y="1002.0" class="n" text-anchor="end">PROTECTION BOARD OVER THE EXPOSED FOUNDATION</text>
<text x="566.0" y="1024.0" class="n" text-anchor="end">INSULATION, 6" BELOW GRADE UP TO THE</text>
<text x="566.0" y="1046.0" class="n" text-anchor="end">UNDERSIDE OF THE Z-FLASHING.</text>
<path d="M598.0,995.0 L628.0,995.0 L1066.2,907.0" class="lead" marker-end="url(#arw)"/>
<text x="588.0" y="1084.0" class="n" text-anchor="end">SLOPE GRADE AWAY FROM THE WALL - SEE CIVIL.</text>
<path d="M598.0,1077.0 L628.0,1077.0 L817.0,949.0" class="lead" marker-end="url(#arw)"/>
<rect x="1494.0" y="639.0" width="13" height="13" fill="#000"/>
<text x="1516.0" y="651.0" class="n" text-anchor="start">CLOSED-CELL SPRAY FOAM AT THE RIM, FULL</text>
<text x="1516.0" y="673.0" class="n" text-anchor="start">DEPTH - NO GAPS AT JOIST ENDS.</text>
<path d="M1484.0,644.0 L1454.0,644.0 L1146.0,669.0" class="lead" marker-end="url(#arw)"/>
<rect x="1494.0" y="699.0" width="13" height="13" fill="#000"/>
<text x="1516.0" y="711.0" class="n" text-anchor="start">SELF-ADHERED TRANSITION MEMBRANE, SHEATHING</text>
<text x="1516.0" y="733.0" class="n" text-anchor="start">TO CONCRETE, 3" MIN. ONTO EACH. THIS IS THE</text>
<text x="1516.0" y="755.0" class="n" text-anchor="start">AIR BARRIER JOINT - INSTALL BEFORE THE WALL</text>
<text x="1516.0" y="777.0" class="n" text-anchor="start">CI.</text>
<path d="M1484.0,704.0 L1454.0,704.0 L1097.0,739.0" class="lead" marker-end="url(#arw)"/>
<rect x="1494.0" y="803.0" width="13" height="13" fill="#000"/>
<text x="1516.0" y="815.0" class="n" text-anchor="start">SILL GASKET, CONTINUOUS. SEAL AROUND EVERY</text>
<text x="1516.0" y="837.0" class="n" text-anchor="start">ANCHOR BOLT.</text>
<path d="M1484.0,808.0 L1454.0,808.0 L1139.0,781.0" class="lead" marker-end="url(#arw)"/>
<circle cx="668.0" cy="1620.0" r="38" fill="none" stroke="#000" stroke-width="1.8"/>
<path d="M630.0,1620.0 l76,0" class="thin"/>
<text x="668.0" y="1612.0" class="tag" text-anchor="middle">1</text>
<text x="668.0" y="1648.0" class="n" text-anchor="middle">A6.10</text>
<text x="728.0" y="1626.0" class="ttl" text-anchor="start">SIDING WALL AT FOUNDATION AND GRADE</text>
<path d="M728.0,1640.0 L1323.0,1640.0" class="med"/>
<text x="728.0" y="1670.0" class="sc" text-anchor="start">SCALE   3" = 1'-0"</text>
<rect x="60" y="1730.0" width="1962" height="134" fill="none" stroke="#000" stroke-width="1.8"/>
<text x="80.0" y="1766.0" class="h3" text-anchor="start">GENERAL NOTES - 1/A6.10</text>
<path d="M80,1780.0 L2002,1780.0" class="thin"/>
<text x="82.0" y="1810.0" class="n" text-anchor="start">1.</text>
<text x="122.0" y="1810.0" class="n" text-anchor="start">SEQUENCE: TRANSITION MEMBRANE, THEN Z-FLASHING, THEN WRB LAPPED OVER THE FLASHING UP-LEG, THEN WALL CI AND RAINSCREEN.</text>
<text x="82.0" y="1842.0" class="n" text-anchor="start">2.</text>
<text x="122.0" y="1842.0" class="n" text-anchor="start">BUILD A 4'-0" MOCK-UP OF THIS CORNER, THROUGH THE FLASHING, FOR ARCHITECT REVIEW BEFORE THE REST OF THE WALL IS CLAD.</text>
<rect x="60" y="1894.0" width="1962" height="134" fill="none" stroke="#000" stroke-width="1.8"/>
<text x="80.0" y="1930.0" class="h3" text-anchor="start">VERIFY / COORDINATE BEFORE ISSUE</text>
<path d="M80,1944.0 L2002,1944.0" class="thin"/>
<text x="82.0" y="1974.0" class="n" text-anchor="start">—</text>
<text x="122.0" y="1974.0" class="n" text-anchor="start">FINISH GRADE ELEVATIONS AGAINST CIVIL ALONG THE FULL LENGTH OF THIS WALL.</text>
<text x="82.0" y="2006.0" class="n" text-anchor="start">—</text>
<text x="122.0" y="2006.0" class="n" text-anchor="start">W1, W2 AND F1 AGREE WITH THE ASSEMBLY SCHEDULE.</text>
</svg>