<title>Solar Ready — R404.5</title>

<style>
  /* ── LIGHT ("PLOT") ─────────────────────────────────────────────── */
  :root {
    --paper:     #FCFCFA;
    --surface:   #F3F3EF;
    --sunk:      #EDEDE7;
    --ink:       #191B1E;
    --graphite:  #5C6167;
    --faint:     #C6C8C3;
    --rule:      #E0E0D9;
    --reference: #1F5EA8;
    --barrier:   #C22A22;
    --barrier-w: #FBEDEB;
    --earth:     #E7E4DA;
    --poche:     #DEDFDA;
    --foamfill:  #CBE0F3;

    --f-title: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --f-body:  "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --f-data:  ui-monospace, SFMono-Regular, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  /* ── DARK ("MODEL SPACE") ───────────────────────────────────────── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:     #131519;
      --surface:   #1A1D22;
      --sunk:      #202429;
      --ink:       #E9E7E2;
      --graphite:  #9BA2AA;
      --faint:     #3B4048;
      --rule:      #292D33;
      --reference: #74AEEC;
      --barrier:   #FF6E5F;
      --barrier-w: #2C1B1A;
      --earth:     #23262B;
      --poche:     #2E3238;
      --foamfill:  #23394F;
    }
  }
  :root[data-theme="dark"] {
    --paper:     #131519;
    --surface:   #1A1D22;
    --sunk:      #202429;
    --ink:       #E9E7E2;
    --graphite:  #9BA2AA;
    --faint:     #3B4048;
    --rule:      #292D33;
    --reference: #74AEEC;
    --barrier:   #FF6E5F;
    --barrier-w: #2C1B1A;
    --earth:     #23262B;
    --poche:     #2E3238;
    --foamfill:  #23394F;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 16.5px;
    line-height: 1.62;
    margin: 0;
    padding: 0 24px 96px;
    -webkit-font-smoothing: antialiased;
  }

  .sheet { max-width: 1120px; margin: 0 auto; }
  .col   { max-width: 72ch; }

  /* ── TITLE BLOCK ────────────────────────────────────────────────── */
  .titleblock {
    border: 1.5px solid var(--ink);
    margin: 40px 0 52px;
    display: grid;
    grid-template-columns: 1fr;
  }
  .tb-main { padding: 24px 26px 22px; border-bottom: 1.5px solid var(--ink); }
  .tb-eyebrow {
    font-family: var(--f-title); font-size: 11px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase; color: var(--barrier);
    margin: 0 0 10px;
  }
  .tb-main h1 {
    font-family: var(--f-title); font-size: clamp(24px, 3.6vw, 38px);
    font-weight: 700; letter-spacing: -.015em; line-height: 1.1;
    margin: 0; text-wrap: balance;
  }
  .tb-sub { font-size: 16px; color: var(--graphite); margin: 12px 0 0; max-width: 62ch; }
  .tb-fields { display: grid; grid-template-columns: repeat(4, 1fr); }
  .tb-fields div { padding: 12px 16px 14px; border-right: 1px solid var(--rule); }
  .tb-fields div:last-child { border-right: 0; }
  .tb-k {
    font-family: var(--f-title); font-size: 9.5px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--graphite);
    display: block; margin-bottom: 4px;
  }
  .tb-v { font-family: var(--f-data); font-size: 13px; color: var(--ink); }
  @media (max-width: 700px) {
    .tb-fields { grid-template-columns: repeat(2, 1fr); }
    .tb-fields div:nth-child(2) { border-right: 0; }
  }

  /* ── SECTION HEADS ──────────────────────────────────────────────── */
  h2 {
    font-family: var(--f-title); font-size: 13px; font-weight: 700;
    letter-spacing: .17em; text-transform: uppercase;
    margin: 0; padding-bottom: 9px;
    border-bottom: 1.5px solid var(--ink);
  }
  section { margin-top: 60px; }
  section > * + * { margin-top: 20px; }
  h3 {
    font-family: var(--f-title); font-size: 15px; font-weight: 700;
    letter-spacing: -.005em; margin: 0;
  }
  p { margin: 0; }
  .lede { font-size: 18px; line-height: 1.55; }

  strong { font-weight: 700; }
  code, .mono { font-family: var(--f-data); font-size: .88em; }
  .ref { color: var(--reference); font-family: var(--f-data); font-size: .86em; white-space: nowrap; }
  .fill { color: var(--barrier); font-family: var(--f-data); font-size: .86em; }

  /* ── STRATEGY CARDS ─────────────────────────────────────────────── */
  .strategy { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5px; background: var(--rule); border: 1.5px solid var(--ink); }
  .strategy > div { background: var(--paper); padding: 18px 20px 20px; }
  .st-zone {
    font-family: var(--f-title); font-size: 9.5px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: var(--graphite);
  }
  .st-mat { font-family: var(--f-title); font-size: 17px; font-weight: 700; margin: 6px 0 8px; line-height: 1.2; }
  .st-why { font-size: 14.5px; line-height: 1.5; color: var(--graphite); }
  @media (max-width: 760px) { .strategy { grid-template-columns: 1fr; } }

  /* ── FIGURES ────────────────────────────────────────────────────── */
  figure { margin: 0; }
  .figframe { border: 1.5px solid var(--ink); background: var(--surface); padding: 14px; overflow-x: auto; }
  .figframe svg { display: block; width: 100%; min-width: 720px; height: auto; }
  figcaption {
    font-size: 14px; color: var(--graphite); margin-top: 12px;
    padding-left: 14px; border-left: 2px solid var(--faint); max-width: 76ch;
  }

  .ln     { fill: none; stroke: var(--graphite); stroke-width: 1.1; }
  .poche  { fill: var(--poche); stroke: var(--graphite); stroke-width: 1; }
  .earth  { fill: var(--earth); stroke: none; }
  .grade  { fill: none; stroke: var(--graphite); stroke-width: 1.6; }
  .datum  { fill: none; stroke: var(--reference); stroke-width: 1; stroke-dasharray: 9 3 2 3; opacity: .85; }
  .gridln { fill: none; stroke: var(--faint); stroke-width: .9; stroke-dasharray: 7 4 2 4; }
  .gridc  { fill: none; stroke: var(--reference); stroke-width: 1.2; }
  .barrier{ fill: none; stroke: var(--barrier); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
  .lead   { fill: none; stroke: var(--barrier); stroke-width: .9; }
  .knc    { fill: var(--paper); stroke: var(--barrier); stroke-width: 1.7; }
  .brk    { fill: none; stroke: var(--barrier); stroke-width: 2; }

  text { font-family: var(--f-data); }
  .t-room { fill: var(--graphite); font-size: 9.5px; letter-spacing: .05em; text-anchor: middle; }
  .t-kn   { fill: var(--barrier); font-size: 12px; font-weight: 700; text-anchor: middle; }
  .t-grid { fill: var(--reference); font-size: 11px; font-weight: 700; text-anchor: middle; }
  .t-dat  { fill: var(--reference); font-size: 10px; letter-spacing: .04em; }
  .t-dat2 { fill: var(--reference); font-size: 9.5px; opacity: .8; }
  .t-lbl  { fill: var(--graphite); font-size: 10px; letter-spacing: .1em; }
  .t-opt  { fill: var(--ink); font-family: var(--f-title); font-size: 12.5px; font-weight: 700; letter-spacing: .04em; }
  .t-note { fill: var(--barrier); font-size: 10.5px; }
  .t-ok   { fill: var(--graphite); font-size: 10.5px; }

  /* ── KEYNOTE LEGEND ─────────────────────────────────────────────── */
  .keynotes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1.5px solid var(--ink); }
  .keynotes li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--rule); align-items: start; }
  .keynotes li:nth-child(odd) { border-right: 1px solid var(--rule); }
  .keynotes li:nth-last-child(-n+2) { border-bottom: 0; }
  .kn-num {
    width: 26px; height: 26px; border-radius: 50%;
    border: 1.7px solid var(--barrier); color: var(--barrier);
    font-family: var(--f-data); font-size: 12.5px; font-weight: 700;
    display: grid; place-items: center; margin-top: 1px;
  }
  .kn-h { font-family: var(--f-title); font-size: 13.5px; font-weight: 700; display: block; margin-bottom: 3px; }
  .kn-b { font-size: 14.5px; line-height: 1.48; color: var(--graphite); }
  .kn-risk { border-left: 3px solid var(--barrier); }
  @media (max-width: 820px) {
    .keynotes { grid-template-columns: 1fr; }
    .keynotes li:nth-child(odd) { border-right: 0; }
    .keynotes li:nth-last-child(2) { border-bottom: 1px solid var(--rule); }
  }

  /* ── TABLE ──────────────────────────────────────────────────────── */
  .tablewrap { overflow-x: auto; border: 1.5px solid var(--ink); }
  table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13.5px; }
  thead th {
    font-family: var(--f-title); font-size: 9.5px; font-weight: 700;
    letter-spacing: .15em; text-transform: uppercase; text-align: left;
    padding: 12px 16px; background: var(--sunk); border-bottom: 1.5px solid var(--ink);
    vertical-align: bottom;
  }
  tbody td { padding: 14px 16px; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.5; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:nth-child(even) { background: var(--surface); }
  .c-comp { width: 15%; font-family: var(--f-title); font-weight: 700; font-size: 13px; }
  .c-code { width: 38%; color: var(--graphite); font-size: 13px; }
  .c-proj { width: 47%; font-family: var(--f-data); font-size: 12.2px; line-height: 1.55; }
  .crit { font-family: var(--f-title); font-size: 9px; font-weight: 700; letter-spacing: .13em; color: var(--ink); display: block; margin-top: 8px; }
  .crit:first-child { margin-top: 0; }
  .flagrow td { background: var(--barrier-w); }

  /* ── MARKUP REVIEW ──────────────────────────────────────────────── */
  .verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5px; background: var(--rule); border: 1.5px solid var(--ink); }
  .verdict > div { background: var(--paper); padding: 20px 22px 22px; }
  .v-h { font-family: var(--f-title); font-size: 9.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .v-ok  .v-h { color: var(--reference); }
  .v-fix .v-h { color: var(--barrier); }
  .v-sub { font-size: 13.5px; color: var(--graphite); display: block; margin-bottom: 12px; }
  .verdict ul { list-style: none; margin: 0; padding: 0; }
  .verdict li { padding: 12px 0; border-top: 1px solid var(--rule); font-size: 14.5px; line-height: 1.5; color: var(--graphite); }
  .verdict li b { font-family: var(--f-title); font-size: 14px; display: block; margin-bottom: 3px; color: var(--ink); }
  @media (max-width: 820px) { .verdict { grid-template-columns: 1fr; } }
  .seal { fill: var(--barrier); }
  .ghost { fill: none; stroke: var(--faint); stroke-width: 1.1; }

  /* ── WALL TYPE DRAWING ──────────────────────────────────────────── */
  .lead-g { fill: none; stroke: var(--graphite); stroke-width: .9; }
  .foam { fill: var(--foamfill); stroke: var(--graphite); stroke-width: 1; }
  .sealdot { fill: var(--barrier); stroke: none; }
  .hx { stroke: var(--graphite); stroke-width: .55; fill: none; }
  .hd { fill: var(--graphite); opacity: .75; }
  .ly { stroke: var(--graphite); stroke-width: 1; }
  .t-cal   { fill: var(--graphite); font-size: 10px; letter-spacing: .02em; }
  .t-cal-b { fill: var(--barrier); font-size: 10px; font-weight: 700; letter-spacing: .02em; }
  .t-side  { fill: var(--graphite); font-size: 10px; letter-spacing: .08em; }
  .t-tag   { fill: var(--ink); font-size: 14px; font-weight: 700; }
  .t-tag2  { fill: var(--graphite); font-size: 9.5px; }
  .t-title { fill: var(--ink); font-family: var(--f-title); font-size: 14px; font-weight: 700; letter-spacing: .04em; }

  /* ── DETAIL ROUTING ─────────────────────────────────────────────── */
  table.route { min-width: 800px; }
  .route td { font-size: 14px; }
  .route .k { font-family: var(--f-data); font-size: 13px; font-weight: 700; color: var(--barrier); width: 66px; text-align: center; }
  .route .cond { width: 40%; }
  .route .need { width: 20%; font-family: var(--f-title); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .need-y { color: var(--barrier); }
  .need-n { color: var(--graphite); }
  .route .loc { width: 28%; font-family: var(--f-data); font-size: 12.2px; color: var(--graphite); }
  .missing { color: var(--barrier); font-weight: 700; }

  /* ── DETAIL CARDS ───────────────────────────────────────────────── */
  .detcard { border: 1.5px solid var(--ink); margin-top: 22px; }
  .det-h { padding: 14px 20px; background: var(--sunk); border-bottom: 1.5px solid var(--ink); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; }
  .det-n { font-family: var(--f-title); font-size: 15px; font-weight: 700; letter-spacing: .02em; }
  .det-k { font-family: var(--f-data); font-size: 11.5px; color: var(--barrier); letter-spacing: .06em; }
  .det-w { font-family: var(--f-data); font-size: 11.5px; color: var(--graphite); letter-spacing: .04em; margin-left: auto; }
  .det-b { padding: 18px 20px 20px; }
  .det-b > p { font-size: 14.5px; color: var(--graphite); max-width: 78ch; }
  .det-b ol { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: d; }
  .det-b ol li { counter-increment: d; position: relative; padding: 11px 0 11px 32px; border-top: 1px solid var(--rule); font-size: 14.5px; line-height: 1.5; color: var(--graphite); max-width: 84ch; }
  .det-b ol li::before { content: counter(d); position: absolute; left: 0; top: 13px; font-family: var(--f-data); font-size: 12px; font-weight: 700; color: var(--barrier); }
  .det-b ol li b { display: block; font-family: var(--f-title); font-size: 14px; color: var(--ink); margin-bottom: 2px; }

  /* ── NOTES ──────────────────────────────────────────────────────── */
  .notes { border: 1.5px solid var(--ink); }
  .notes-h { padding: 12px 18px; background: var(--sunk); border-bottom: 1.5px solid var(--ink); font-family: var(--f-title); font-size: 9.5px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
  .notes ol { margin: 0; padding: 8px 18px 16px 18px; list-style: none; counter-reset: n; }
  .notes li { counter-increment: n; position: relative; padding: 11px 0 11px 62px; border-bottom: 1px solid var(--rule); font-family: var(--f-data); font-size: 12.4px; line-height: 1.55; }
  .notes li:last-child { border-bottom: 0; }
  .notes li::before { content: "AS-" counter(n, decimal-leading-zero); position: absolute; left: 0; top: 11px; color: var(--barrier); font-weight: 700; }
  .notes-plain li { padding-left: 44px; }
  .notes-plain li::before { content: counter(n) "."; }

  /* ── OPEN ITEMS ─────────────────────────────────────────────────── */
  .open { display: grid; gap: 1.5px; background: var(--rule); border: 1.5px solid var(--ink); }
  .open > div { background: var(--paper); padding: 18px 20px; display: grid; grid-template-columns: 92px 1fr; gap: 18px; align-items: start; }
  .tag {
    font-family: var(--f-title); font-size: 9px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; padding: 4px 0; text-align: center;
    border: 1.3px solid currentColor; border-radius: 2px;
  }
  .tag-block { color: var(--barrier); }
  .tag-conf  { color: var(--reference); }
  .open-b { font-size: 15px; line-height: 1.55; max-width: 74ch; }
  .open-b b { font-family: var(--f-title); font-size: 14.5px; display: block; margin-bottom: 3px; color: var(--ink); }
  @media (max-width: 620px) { .open > div { grid-template-columns: 1fr; gap: 10px; } .tag { justify-self: start; padding: 4px 12px; } }

  hr.sheetend { border: 0; border-top: 1.5px solid var(--ink); margin: 64px 0 16px; }
  .foot { font-family: var(--f-data); font-size: 11.5px; color: var(--graphite); letter-spacing: .03em; }
</style>
<style>
  /* ── DETAIL STYLE, MATCHED TO THE SET ───────────────────────────── */
  .abd   { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-dasharray: 11 6; }
  .dln   { fill: none; stroke: var(--ink); stroke-width: 1; }
  .dhv   { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .dfoam { fill: var(--foamfill); stroke: var(--ink); stroke-width: 1; }
  .dpo   { fill: url(#Pcon); stroke: var(--ink); stroke-width: 1; }
  .dea   { fill: url(#Pear); stroke: none; }
  .dgr   { fill: url(#Pgrv); stroke: none; }
  .dbat  { fill: url(#Pbat); stroke: var(--ink); stroke-width: 1; }
  .drig  { fill: url(#Prig); stroke: var(--ink); stroke-width: 1; }
  .dwd   { fill: url(#Pwd);  stroke: var(--ink); stroke-width: 1; }
  .dhtch { stroke: var(--graphite); stroke-width: .6; fill: none; }
  /* thermal envelope plan */
  .envb  { fill: none; stroke: var(--ink);   stroke-width: 15; stroke-linejoin: miter; }
  .envp  { fill: none; stroke: var(--paper); stroke-width: 13; stroke-linejoin: miter; }
  .envh  { fill: none; stroke: url(#Pwl);    stroke-width: 13; stroke-linejoin: miter; }
  .dout  { fill: var(--sunk); stroke: var(--faint); stroke-width: 1; }
  .t-rm  { fill: var(--ink); font-family: var(--f-data); font-size: 12px; letter-spacing: .05em; }
  .t-ch  { fill: var(--graphite); font-family: var(--f-data); font-size: 11px; }
  .t-an  { fill: var(--ink); font-family: var(--f-data); font-size: 11px; letter-spacing: .02em; }
  .t-bb  { fill: var(--ink); font-family: var(--f-data); font-size: 12px; letter-spacing: .05em; }
  .t-bs  { fill: var(--graphite); font-family: var(--f-data); font-size: 9px; }
  .dlead { fill: none; stroke: var(--ink); stroke-width: .8; }
  .t-d   { fill: var(--ink); font-family: var(--f-data); font-size: 11.5px; letter-spacing: .01em; }
  .t-dt  { fill: var(--ink); font-family: var(--f-title); font-size: 20px; font-weight: 400; letter-spacing: .01em; }
  .t-ds  { fill: var(--graphite); font-family: var(--f-data); font-size: 11px; }
  .t-dn  { fill: var(--ink); font-family: var(--f-data); font-size: 11.5px; }
  .t-dl  { fill: var(--ink); font-family: var(--f-data); font-size: 11.5px; letter-spacing: .06em; }
  /* sheet-plan diagram */
  .sp-b  { fill: var(--sunk); stroke: var(--ink); stroke-width: 1.1; }
  .sp-d  { fill: none; stroke: var(--graphite); stroke-width: .9; stroke-dasharray: 5 4; }
  .sp-h  { fill: var(--ink); font-family: var(--f-data); font-size: 11.5px; font-weight: 700; letter-spacing: .05em; }
  .sp-t  { fill: var(--graphite); font-family: var(--f-data); font-size: 10.5px; }
  .sp-n  { fill: var(--reference); font-family: var(--f-data); font-size: 11px; font-weight: 700; }
  .newblk .sp-b { fill: var(--barrier-w); stroke: var(--barrier); stroke-width: 1.6; }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <pattern id="Pcon" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="6" r="1.1" fill="var(--graphite)"/><circle cx="17" cy="14" r=".9" fill="var(--graphite)"/>
      <circle cx="10" cy="21" r="1" fill="var(--graphite)"/><circle cx="22" cy="4" r=".8" fill="var(--graphite)"/>
      <path class="dhtch" d="M19 20 l3.4 2.8 l-3.8 1.4 z"/><path class="dhtch" d="M6 13 l2.8 2.2 l-3 1.1 z"/>
      <path class="dhtch" d="M13 3 l2.6 2 l-2.8 1 z"/></pattern>
    <pattern id="Pear" width="24" height="18" patternUnits="userSpaceOnUse">
      <path class="dhtch" d="M0 7 H10 M14 7 H24 M5 16 H19"/>
      <path class="dhtch" d="M2 7 l-3 -5 M8 7 l-3 -5 M16 7 l-3 -5 M22 7 l-3 -5 M8 16 l-3 -5 M16 16 l-3 -5"/></pattern>
    <pattern id="Pgrv" width="18" height="16" patternUnits="userSpaceOnUse">
      <circle class="dhtch" cx="5" cy="5" r="3"/><circle class="dhtch" cx="13" cy="11" r="2.4"/>
      <circle class="dhtch" cx="15" cy="3" r="1.7"/></pattern>
    <pattern id="Prig" width="10" height="10" patternUnits="userSpaceOnUse">
      <path class="dhtch" d="M0 10 L10 0 M-2 2 L2 -2 M8 12 L12 8"/></pattern>
    <pattern id="Pbat" width="24" height="14" patternUnits="userSpaceOnUse">
      <path class="dhtch" d="M0 7 Q6 -3 12 7 Q18 17 24 7"/></pattern>
    <pattern id="Pwl" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 9 L9 0 M-2 2 L2 -2 M7 11 L11 7" stroke="var(--ink)" stroke-width=".9" fill="none"/></pattern>
    <pattern id="Pwd" width="16" height="16" patternUnits="userSpaceOnUse">
      <path class="dhtch" d="M0 3 H16 M0 9 H16 M0 14 H16"/></pattern>
