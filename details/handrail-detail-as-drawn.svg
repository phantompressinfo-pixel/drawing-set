<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1000" width="1560" height="1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="xh" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#000" stroke-width="0.6"/>
    </pattern>
    <pattern id="wg" width="38" height="150" patternUnits="userSpaceOnUse">
      <path d="M8 0 q6 38 0 75 q-6 37 0 75" fill="none" stroke="#000" stroke-width="0.45"/>
      <path d="M24 0 q-5 30 0 60 q5 45 0 90" fill="none" stroke="#000" stroke-width="0.45"/>
    </pattern>
    <marker id="tk" markerWidth="11" markerHeight="11" refX="5.5" refY="5.5" orient="auto">
      <line x1="2" y1="9" x2="9" y2="2" stroke="#000" stroke-width="0.9"/>
    </marker>
    <style>
      .o { fill:none; stroke:#000; stroke-width:1.2; stroke-linejoin:round; }
      .x { fill:none; stroke:#000; stroke-width:0.55; }
      .d { fill:none; stroke:#000; stroke-width:0.6; marker-start:url(#tk); marker-end:url(#tk); }
      .l { fill:none; stroke:#000; stroke-width:0.6; }
      .n { font-size:13px; fill:#000; }
      .f { font-size:13px; fill:#000; font-weight:bold; }
    </style>
  </defs>
  <rect x="0" y="0" width="1560" height="1000" fill="#fff"/>

  <!-- CAP 2" x 2 1/4", bands 1 1/8 + 1 1/8, recess 3/8 each side, neck 1 1/4 -->
  <path d="M 430 220
           A 40 40 0 0 1 470 180
           L 650 180
           A 40 40 0 0 1 690 220
           L 690 326.25
           L 641.25 326.25
           L 641.25 472.5
           L 478.75 472.5
           L 478.75 326.25
           L 430 326.25 Z"
        fill="url(#xh)" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- BUILT-UP POST 2 1/4" = 3/4 + 3/4 + 3/4 -->
  <rect x="413.75" y="472.5" width="292.5" height="368" fill="url(#wg)" stroke="#000" stroke-width="1.2"/>
  <line class="o" x1="511.25" y1="472.5" x2="511.25" y2="840"/>
  <line class="o" x1="608.75" y1="472.5" x2="608.75" y2="840"/>

  <line class="x" x1="260" y1="840" x2="413.75" y2="840" stroke-width="1"/>
  <line class="x" x1="706.25" y1="840" x2="860" y2="840" stroke-width="1"/>
  <path class="x" d="M 413.75 840 L 470 840 L 488 884 L 504 812 L 520 840 L 706.25 840" stroke-width="1"/>

  <!-- TOP DIM 2" -->
  <line class="x" x1="430" y1="172" x2="430" y2="112"/>
  <line class="x" x1="690" y1="172" x2="690" y2="112"/>
  <line class="d" x1="430" y1="124" x2="690" y2="124"/>
  <text class="n" x="560" y="118" text-anchor="middle">2"</text>

  <!-- LEFT DIMS: 2 1/4" outer; 1 1/8" + 1 1/8" inner -->
  <line class="x" x1="422" y1="180" x2="290" y2="180"/>
  <line class="x" x1="470" y1="326.25" x2="330" y2="326.25"/>
  <line class="x" x1="422" y1="472.5" x2="290" y2="472.5"/>
  <line class="d" x1="358" y1="180" x2="358" y2="326.25"/>
  <line class="d" x1="358" y1="326.25" x2="358" y2="472.5"/>
  <line class="d" x1="310" y1="180" x2="310" y2="472.5"/>
  <text class="n" x="352" y="253" text-anchor="middle" transform="rotate(-90 352 253)">1 1/8"</text>
  <text class="n" x="352" y="399" text-anchor="middle" transform="rotate(-90 352 399)">1 1/8"</text>
  <text class="n" x="304" y="326" text-anchor="middle" transform="rotate(-90 304 326)">2 1/4"</text>

  <!-- RECESS DEPTH 3/8 -->
  <line class="x" x1="430" y1="334" x2="430" y2="372"/>
  <line class="x" x1="478.75" y1="334" x2="478.75" y2="372"/>
  <line class="d" x1="430" y1="364" x2="478.75" y2="364"/>
  <line class="l" x1="426" y1="364" x2="392" y2="380"/>
  <text class="n" x="388" y="384" text-anchor="end">3/8"</text>

  <!-- 1/2" OFFSET, POST FACE TO NECK FACE -->
  <line class="x" x1="413.75" y1="480" x2="413.75" y2="530"/>
  <line class="x" x1="478.75" y1="480" x2="478.75" y2="530"/>
  <line class="d" x1="413.75" y1="518" x2="478.75" y2="518"/>
  <line class="l" x1="410" y1="518" x2="376" y2="534"/>
  <text class="n" x="372" y="538" text-anchor="end">1/2"</text>

  <!-- POST PLIES 3/4 + 3/4 + 3/4 -->
  <line class="x" x1="413.75" y1="700" x2="413.75" y2="770"/>
  <line class="x" x1="511.25" y1="700" x2="511.25" y2="770"/>
  <line class="x" x1="608.75" y1="700" x2="608.75" y2="770"/>
  <line class="x" x1="706.25" y1="700" x2="706.25" y2="770"/>
  <line class="d" x1="413.75" y1="758" x2="511.25" y2="758"/>
  <line class="d" x1="511.25" y1="758" x2="608.75" y2="758"/>
  <line class="d" x1="608.75" y1="758" x2="706.25" y2="758"/>
  <rect x="440" y="742" width="46" height="17" fill="#fff"/><text class="n" x="462" y="754" text-anchor="middle">3/4"</text>
  <rect x="537" y="742" width="46" height="17" fill="#fff"/><text class="n" x="560" y="754" text-anchor="middle">3/4"</text>
  <rect x="634" y="742" width="46" height="17" fill="#fff"/><text class="n" x="657" y="754" text-anchor="middle">3/4"</text>
  <line class="x" x1="413.75" y1="770" x2="413.75" y2="812"/>
  <line class="x" x1="706.25" y1="770" x2="706.25" y2="812"/>
  <line class="d" x1="413.75" y1="800" x2="706.25" y2="800"/>
  <rect x="530" y="784" width="60" height="17" fill="#fff"/><text class="n" x="560" y="796" text-anchor="middle">2 1/4"</text>

  <!-- POST PROUD OF CAP -->
  <line class="l" x1="410" y1="478" x2="330" y2="600"/>
  <text class="f" x="326" y="604" text-anchor="end">1/8" PROUD</text>
  <line class="l" x1="710" y1="478" x2="760" y2="560"/>

  <!-- CHECK -->
  <text class="f" x="800" y="200">PROFILE AS DRAWN &#8212; CHECKED AGAINST 2021 IBC &#167;1014.3.2 AND &#167;1014.4</text>
  <text class="n" x="800" y="226">PERIMETER 8 1/2" &gt; 6 1/4" &#8594; TYPE II APPLIES</text>
  <text class="n" x="800" y="246">RECESS 3/8" DEEP (5/16" MIN) &#8212; OK</text>
  <text class="n" x="800" y="266">DEPTH RUNS 1 1/8" (3/8" MIN) &#8212; OK</text>
  <text class="n" x="800" y="286">DEPTH REACHES 2 1/4" BELOW TOP (1 3/4" MIN) &#8212; OK</text>
  <text class="n" x="800" y="306">WIDTH ABOVE RECESS 2" (1 1/4" TO 2 3/4") &#8212; OK</text>
  <text class="f" x="800" y="334">RECESS BEGINS 1 1/8" BELOW TOP OF PROFILE; 3/4" IS THE MAX &#8212; NOT OK</text>
  <text class="f" x="800" y="358">2 1/4" POST STANDS 1/8" PROUD OF THE 2" CAP EACH SIDE &#8212; NOT OK</text>
  <text class="n" x="800" y="378">&#167;1014.4 EXC. 3: AT AN 8 1/2" PERIMETER THE 1 1/2" ZONE REDUCES BY</text>
  <text class="n" x="800" y="396">((8.5 &#8722; 4) / 0.5) x 1/8" = 1 1/8", LEAVING 3/8". NOTHING MAY PROJECT</text>
  <text class="n" x="800" y="414">BEYOND THE SIDES OF THE RAIL WITHIN 3/8" OF ITS BOTTOM. THE POST</text>
  <text class="n" x="800" y="432">PROJECTS AT 0" &#8212; FINGERS CURLING UNDER THE GRIP HIT ITS SHOULDER.</text>

  <text class="f" x="800" y="474">FIX &#8212; BOTH ARE ONE-LINE MOVES:</text>
  <text class="n" x="800" y="496">1. BANDS 3/4" + 1 1/2" INSTEAD OF 1 1/8" + 1 1/8". CAP STAYS 2" x 2 1/4",</text>
  <text class="n" x="800" y="514">    NECK STAYS 1 1/4", RECESS THEN RUNS 3/4" TO 2 1/4" BELOW THE TOP.</text>
  <text class="n" x="800" y="536">2. POST 2" MAX: 3/4" + 1/2" + 3/4" PLIES, FLUSH WITH THE CAP.</text>
  <text class="n" x="800" y="554">    NOTHING THEN PROJECTS BEYOND THE SIDES OF THE GRIP.</text>

  <text class="f" x="800" y="598">ALTERNATIVE &#8212; DROP THE RECESS ALTOGETHER:</text>
  <text class="n" x="800" y="620">A PLAIN 2" x 1 1/8" ROUNDED CAP HAS A 6 1/4" PERIMETER, A 2" MAX AND</text>
  <text class="n" x="800" y="638">1 1/8" MIN CROSS SECTION &#8212; TYPE I PER &#167;1014.3.1, NO RECESS REQUIRED.</text>
  <text class="n" x="800" y="656">THAT IS EXACTLY AT THE 6 1/4" LIMIT; 2" x 1" GIVES A 6" PERIMETER AND</text>
  <text class="n" x="800" y="674">REAL TOLERANCE. THE POST MUST STILL NOT PROJECT BEYOND THE SIDES</text>
  <text class="n" x="800" y="692">OF THE RAIL WITHIN 1" OF ITS BOTTOM AT THAT PERIMETER.</text>
</svg>
