<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1000" width="1520" height="1000" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="xh" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#000" stroke-width="0.6"/>
    </pattern>
    <pattern id="wg" width="38" height="150" patternUnits="userSpaceOnUse">
      <path d="M8 0 q6 38 0 75 q-6 37 0 75" fill="none" stroke="#000" stroke-width="0.45"/>
      <path d="M24 0 q-5 30 0 60 q5 45 0 90" fill="none" stroke="#000" stroke-width="0.45"/>
    </pattern>
    <marker id="tk" markerWidth="11" markerHeight="11" refX="5.5" refY="5.5" orient="auto">
      <line x1="2" y1="9" x2="9" y2="2" stroke="#000" stroke-width="0.9"/>
    </marker>
    <style>
      .o { fill:none; stroke:#000; stroke-width:1.2; stroke-linejoin:round; }
      .x { fill:none; stroke:#000; stroke-width:0.55; }
      .d { fill:none; stroke:#000; stroke-width:0.6; marker-start:url(#tk); marker-end:url(#tk); }
      .l { fill:none; stroke:#000; stroke-width:0.6; }
      .n { font-size:13px; fill:#000; }
      .f { font-size:12px; fill:#000; font-weight:bold; }
    </style>
  </defs>
  <rect x="0" y="0" width="1520" height="1000" fill="#fff"/>

  <!-- CAP: 2 1/2 x 2, bands 3/4 + 3/4 + 1/2, recess 3/8 deep each side -->
  <path d="M 460 234
           A 34 34 0 0 1 494 200
           L 626 200
           A 34 34 0 0 1 660 234
           L 660 260
           L 630 260
           L 630 320
           L 660 320
           L 660 340
           A 20 20 0 0 1 640 360
           L 480 360
           A 20 20 0 0 1 460 340
           L 460 320
           L 490 320
           L 490 260
           L 460 260 Z"
        fill="url(#xh)" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- SUB-RAIL / POST 2" -->
  <rect x="480" y="360" width="160" height="480" fill="url(#wg)" stroke="#000" stroke-width="1.2"/>

  <!-- FLOOR LINE + BREAK -->
  <line class="x" x1="300" y1="840" x2="480" y2="840" stroke-width="1"/>
  <line class="x" x1="640" y1="840" x2="820" y2="840" stroke-width="1"/>
  <path class="x" d="M 480 840 L 525 840 L 542 884 L 558 812 L 574 840 L 640 840" stroke-width="1"/>

  <!-- TOP DIM 2 1/2 -->
  <line class="x" x1="460" y1="192" x2="460" y2="140"/>
  <line class="x" x1="660" y1="192" x2="660" y2="140"/>
  <line class="d" x1="460" y1="152" x2="660" y2="152"/>
  <text class="n" x="560" y="146" text-anchor="middle">2 1/2"</text>

  <!-- LEFT DIMS: 2" outer; 3/4" + 3/4" + 1/2" inner -->
  <line class="x" x1="452" y1="200" x2="330" y2="200"/>
  <line class="x" x1="452" y1="260" x2="370" y2="260"/>
  <line class="x" x1="452" y1="320" x2="370" y2="320"/>
  <line class="x" x1="452" y1="360" x2="330" y2="360"/>
  <line class="d" x1="398" y1="200" x2="398" y2="260"/>
  <line class="d" x1="398" y1="260" x2="398" y2="320"/>
  <line class="d" x1="398" y1="320" x2="398" y2="360"/>
  <line class="d" x1="350" y1="200" x2="350" y2="360"/>
  <text class="n" x="392" y="230" text-anchor="middle" transform="rotate(-90 392 230)">3/4"</text>
  <text class="n" x="392" y="290" text-anchor="middle" transform="rotate(-90 392 290)">3/4"</text>
  <text class="n" x="392" y="340" text-anchor="middle" transform="rotate(-90 392 340)">1/2"</text>
  <text class="n" x="344" y="280" text-anchor="middle" transform="rotate(-90 344 280)">2"</text>

  <!-- RECESS DEPTH 3/8 EACH SIDE -->
  <line class="x" x1="460" y1="268" x2="460" y2="300"/>
  <line class="x" x1="490" y1="268" x2="490" y2="300"/>
  <line class="d" x1="460" y1="292" x2="490" y2="292"/>
  <line class="l" x1="456" y1="292" x2="424" y2="306"/>
  <text class="n" x="420" y="310" text-anchor="end">3/8"</text>
  <line class="x" x1="630" y1="268" x2="630" y2="300"/>
  <line class="x" x1="660" y1="268" x2="660" y2="300"/>
  <line class="d" x1="630" y1="292" x2="660" y2="292"/>
  <line class="l" x1="664" y1="292" x2="688" y2="304"/>
  <text class="n" x="692" y="308" text-anchor="start">3/8"</text>

  <!-- 1/4" CAP OVERHANG EACH SIDE -->
  <line class="x" x1="460" y1="368" x2="460" y2="440"/>
  <line class="x" x1="480" y1="368" x2="480" y2="440"/>
  <line class="d" x1="460" y1="428" x2="480" y2="428"/>
  <line class="l" x1="456" y1="428" x2="424" y2="442"/>
  <text class="n" x="420" y="446" text-anchor="end">1/4"</text>
  <line class="x" x1="640" y1="368" x2="640" y2="440"/>
  <line class="x" x1="660" y1="368" x2="660" y2="440"/>
  <line class="d" x1="640" y1="428" x2="660" y2="428"/>
  <line class="l" x1="664" y1="428" x2="688" y2="440"/>
  <text class="n" x="692" y="444" text-anchor="start">1/4"</text>

  <!-- SUB-RAIL DIM 2" -->
  <line class="d" x1="480" y1="500" x2="640" y2="500"/>
  <rect x="536" y="486" width="48" height="16" fill="#fff"/>
  <text class="n" x="560" y="497" text-anchor="middle">2"</text>

  <!-- CHECK NOTE -->
  
  <text class="f" x="770" y="220">PROFILE AS DRAWN &#8212; CHECKED AGAINST 2021 IBC &#167;1014.3.2 (TYPE II):</text>
  <text class="n" x="770" y="242">PERIMETER 10 1/2" &gt; 6 1/4" &#8594; TYPE II APPLIES</text>
  <text class="n" x="770" y="260">RECESS BEGINS 3/4" BELOW TOP (3/4" MAX) &#8212; OK, AT THE LIMIT</text>
  <text class="n" x="770" y="278">RECESS 3/8" DEEP (5/16" MIN) &#8212; OK</text>
  <text class="n" x="770" y="296">DEPTH RUNS 3/4" (3/8" MIN) &#8212; OK</text>
  <text class="n" x="770" y="314">WIDTH ABOVE RECESS 2 1/2" (1 1/4"&#8211;2 3/4") &#8212; OK</text>
  <text class="f" x="770" y="338">DEPTH ENDS 1 1/2" BELOW TOP; MUST CONTINUE TO 1 3/4" &#8212; NOT OK</text>
  <text class="n" x="770" y="356">FIX: BOTTOM BAND 1/2" &#8594; 1/4" (BANDS 3/4 + 1 + 1/4 = 2" OVERALL),</text>
  <text class="n" x="770" y="374">OR KEEP THE 1/2" BAND AND MAKE THE CAP 2 1/4" TALL.</text>
</svg>
