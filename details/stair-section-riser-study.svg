  <text class="n" x="314" y="715.3" text-anchor="middle" transform="rotate(-90 314 715.3)">10'-3 3/4"</text>
  <text class="f" x="690" y="292">21 RISERS @ 6 55/64"</text>
  <text class="s" x="690" y="310">20 TREADS @ 11" = 18'-4" RUN</text>
  <line class="l" x1="686" y1="300" x2="630" y2="342"/>
  <text class="f" x="630" y="646">18 RISERS @ 6 7/8" (EXACT)</text>
  <text class="s" x="630" y="664">17 TREADS @ 11" = 15'-7" RUN</text>
  <line class="l" x1="626" y1="654" x2="570" y2="700"/>
  <text class="tt" x="146" y="960">SECTION DRAWN TO WORKING RISER COUNTS</text>
  <line class="x" x1="146" y1="969" x2="980" y2="969" stroke-width="1"/>
  <text class="s" x="146" y="991">BOTH FLIGHTS SHOWN AT COUNTS THAT LAND EXACTLY ON THE FLOOR ELEVATIONS.</text>
  <text class="s" x="146" y="1011">DASHED LINE IS THE NOSING DATUM. HANDRAIL AND GUARD NOT SHOWN.</text>
  <line x1="1040" y1="140" x2="1040" y2="1132" stroke="#000" stroke-width="0.4"/>
  <text class="tt" x="1080" y="176">RISER TABLE</text>
  <line class="x" x1="1080" y1="185" x2="1860" y2="185" stroke-width="1"/>
  <text class="f" x="1080" y="218">BASEMENT 89'-4"  TO  MAIN 99'-7 3/4"</text>
  <text class="f" x="1650" y="218">FLOOR TO FLOOR 123 3/4"</text>
  <text class="f" x="1104" y="240">7 1/2" AS DETAILED</text>
  <text class="f" x="1300" y="240">16.5 RISERS</text>
  <text class="f" x="1430" y="240">DOES NOT DIVIDE</text>
  <text class="f" x="1812" y="240">FAILS</text>
  <text class="f" x="1104" y="260">18 RISERS @ 6 7/8"</text>
  <text class="f" x="1300" y="260">EXACT</text>
  <text class="f" x="1430" y="260">17 TREADS @ 11" = 15'-7"</text>
  <text class="f" x="1830" y="260">USE</text>
  <text class="n" x="1104" y="280">17 RISERS @ 7 9/32"</text>
  <text class="n" x="1300" y="280">EXACT</text>
  <text class="n" x="1430" y="280">16 TREADS @ 11" = 14'-8"</text>
  <text class="n" x="1104" y="300">16 RISERS @ 7 47/64"</text>
  <text class="n" x="1300" y="300">EXACT</text>
  <text class="n" x="1430" y="300">AT THE 7 3/4" LIMIT - NO TOLERANCE</text>
  <text class="f" x="1080" y="346">MAIN 99'-7 3/4"  TO  UPPER 111'-7 3/4"</text>
  <text class="f" x="1650" y="346">FLOOR TO FLOOR 144"</text>
  <text class="f" x="1104" y="368">21 RISERS @ 6 55/64"</text>
  <text class="f" x="1300" y="368">EXACT</text>
  <text class="f" x="1430" y="368">20 TREADS @ 11" = 18'-4"</text>
  <text class="f" x="1830" y="368">USE</text>
  <text class="n" x="1104" y="388">6 7/8" AS DETAILED</text>
  <text class="n" x="1300" y="388">144 3/8"</text>
  <text class="n" x="1430" y="388">3/8" LONG OVER 21 RISERS</text>
  <text class="tt" x="1080" y="456">WHY 7 1/2" DOES NOT WORK ON THE LOWER FLIGHT</text>
  <line class="x" x1="1080" y1="465" x2="1860" y2="465" stroke-width="1"/>
  <path class="o" d="M 1150.0 700.0 L 1150.0 734.5 L 1200.6 734.5 L 1200.6 769.0 L 1251.2 769.0 L 1251.2 803.5"/>
  <line class="dat" x1="1080" y1="682.8" x2="1520" y2="682.8"/>
  <text class="s" x="1526" y="686.8">MAIN LEVEL 99'-7 3/4"</text>
  <rect x="1150.0" y="682.8" width="101.2" height="17.2" fill="url(#hx)" stroke="#000" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line class="x" x1="1074.0" y1="682.8" x2="1150.0" y2="682.8"/>
  <line class="x" x1="1074.0" y1="700.0" x2="1150.0" y2="700.0"/>
  <line class="d" x1="1092.0" y1="682.8" x2="1092.0" y2="700.0"/>
  <text class="f" x="1084.0" y="695.4" text-anchor="end">3 3/4"</text>
  <text class="s" x="1269.2" y="734.5">TOP OF THE 16th RISER</text>
  <text class="s" x="1080" y="870">16 RISERS @ 7 1/2" = 120"  &#8212;  LANDS 3 3/4" BELOW THE MAIN LEVEL, AS SHOWN.</text>
  <text class="s" x="1080" y="890">17 RISERS @ 7 1/2" = 127 1/2"  &#8212;  OVERSHOOTS THE MAIN LEVEL BY 3 3/4".</text>
  <text class="f" x="1080" y="914">123 3/4" DIVIDED BY 7 1/2" IS 16.5. THERE IS NO WHOLE NUMBER OF 7 1/2" RISERS.</text>
  <text class="tt" x="1080" y="1000">NOTES</text>
  <line class="x" x1="1080" y1="1009" x2="1860" y2="1009" stroke-width="1"/>
  <text class="n" x="1080" y="1032">1.</text>
  <text class="n" x="1108" y="1032">ELEVATIONS READ FROM THE STAIR SECTION AT GRID 6-7. FIELD VERIFY ALL THREE BEFORE ACTING ON THIS TABLE.</text>
  <text class="n" x="1080" y="1056">2.</text>
  <text class="n" x="1108" y="1056">RISER COUNT IS SET BY TOTAL RISE. INTERMEDIATE LANDINGS DO NOT CHANGE IT - THEY CHANGE THE PLAN RUN ONLY.</text>
  <text class="n" x="1080" y="1080">3.</text>
  <text class="n" x="1108" y="1080">ALL RISERS IN A FLIGHT EQUAL. SET FINISH FLOOR TO FINISH FLOOR, NOT SUBFLOOR TO SUBFLOOR.</text>
  <text class="n" x="1080" y="1104">4.</text>
  <text class="n" x="1108" y="1104">AT 18 RISERS THE LOWER FLIGHT MATCHES THE UPPER AT 6 7/8" AND THE TWO ENLARGED TREAD DETAILS BECOME ONE.</text>
  <text class="n" x="1080" y="1128">5.</text>
  <text class="n" x="1108" y="1128">AT A 12" TREAD ADD 17" TO THE LOWER RUN AND 20" TO THE UPPER RUN. CONFIRM AGAINST THE PLAN FIRST.</text>
  <rect x="60" y="1170" width="1800" height="1" fill="#000"/>
  <text class="s" x="60" y="1192">FIELD VERIFY ALL FLOOR ELEVATIONS AND FINISH FLOOR THICKNESSES BEFORE CUTTING STRINGERS.</text>
</svg>