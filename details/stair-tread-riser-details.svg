  <text class="n" x="1490.5" y="212.9" text-anchor="middle">11"</text>
  <text class="tt" x="1100.0" y="789">4 &#8212; TREAD &amp; RISER AT MAIN &#8212; UPPER LEVEL</text>
  <line class="x" x1="1100.0" y1="798" x2="1910.0" y2="798" stroke-width="1"/>
  <text class="s" x="1100.0" y="820">RISER 6 7/8" &#183; TREAD 11" &#183; COMPLIES WITH THE BASE LIMITS OF &#167;1011.5.2</text>
  <text class="tt" x="100" y="870">GENERAL NOTES</text>
  <line class="x" x1="100" y1="879" x2="1800" y2="879" stroke-width="1"/>
  <text class="n" x="100" y="900">1.</text>
  <text class="n" x="134" y="900">CODE BASIS. 2021 IBC AS ADOPTED AND AMENDED BY ASPEN M.C. CH. 8.20. THE CITY DID NOT ADOPT</text>
  <text class="n" x="134" y="918">THE IRC (&#167;8.16.010) &#8212; RESIDENTIAL WORK RUNS UNDER THE IBC AS GROUP R-3.</text>
  <text class="n" x="100" y="946">2.</text>
  <text class="n" x="134" y="946">RISER AND TREAD. GROUP R-3 LIMITS ARE 7 3/4" MAX RISER AND 10" MIN TREAD &#8212; &#167;1011.5.2 EXC. 3.</text>
  <text class="n" x="134" y="964">BASEMENT&#8211;MAIN 7 1/2" / 11". MAIN&#8211;UPPER 6 7/8" / 11". BOTH COMPLY.</text>
  <text class="f" x="134" y="982">** THE 7 1/2" RISER EXCEEDS THE 7" BASE LIMIT AND STANDS ONLY ON EXC. 3. CITE IT ON THE SHEET. **</text>
  <text class="n" x="100" y="1010">3.</text>
  <text class="n" x="134" y="1010">TREAD DEPTH IS MEASURED HORIZONTALLY BETWEEN THE VERTICAL PLANES OF THE FOREMOST PROJECTION</text>
  <text class="n" x="134" y="1028">OF ADJACENT TREADS, AT A RIGHT ANGLE TO THE NOSING &#8212; &#167;1011.5.2.</text>
  <text class="n" x="100" y="1056">4.</text>
  <text class="n" x="134" y="1056">UNIFORMITY. WITHIN EACH FLIGHT, LARGEST TO SMALLEST RISER AND LARGEST TO SMALLEST TREAD SHALL</text>
  <text class="n" x="134" y="1074">NOT VARY MORE THAN 3/8" &#8212; &#167;1011.5.4. THE TWO FLIGHTS MAY DIFFER FROM EACH OTHER; THE TOLERANCE</text>
  <text class="n" x="134" y="1092">IS PER FLIGHT.</text>
  <text class="f" x="134" y="1110">** VERIFY TOP AND BOTTOM RISERS AGAINST ACTUAL FINISH FLOOR THICKNESS AT EACH LEVEL BEFORE</text>
  <text class="f" x="134" y="1128">CUTTING STRINGERS. THIS IS WHERE STAIRS FAIL INSPECTION. **</text>
  <text class="n" x="100" y="1156">5.</text>
  <text class="n" x="134" y="1156">ALL RISE AND RUN DIMENSIONS ARE TO FINISH SURFACES AND ARE EXCLUSIVE OF CARPET, RUGS OR</text>
  <text class="n" x="134" y="1174">RUNNERS &#8212; &#167;1011.5.1.</text>
  <text class="n" x="960" y="900">6.</text>
  <text class="n" x="994" y="900">NOSING PROFILE. EASE THE LEADING EDGE OF EVERY TREAD &#8212; CURVATURE OR BEVEL 1/16" MIN TO 9/16" MAX</text>
  <text class="n" x="994" y="918">FROM THE FOREMOST PROJECTION &#8212; &#167;1011.5.5. REQUIRED EVEN WHERE THE TREAD DOES NOT PROJECT.</text>
  <text class="n" x="960" y="946">7.</text>
  <text class="n" x="994" y="946">NO NOSING PROJECTION IS REQUIRED AT AN 11" TREAD. THE 3/4"&#8211;1 1/4" PROJECTION OF &#167;1011.5.2 EXC. 3</text>
  <text class="n" x="994" y="964">APPLIES ONLY WHERE THE TREAD IS LESS THAN 11". IF THE TREAD IS REDUCED, ADD THE PROJECTION, HOLD</text>
  <text class="n" x="994" y="982">IT TO 1 1/4" MAX, AND MATCH IT AT EVERY TREAD AND AT THE FLOOR EDGE AT THE TOP OF THE FLIGHT</text>
  <text class="n" x="994" y="1000">&#8212; &#167;1011.5.5.1 AND &#167;1011.5.5.2.</text>
  <text class="n" x="960" y="1028">8.</text>
  <text class="n" x="994" y="1028">RISERS SHALL BE SOLID &#8212; &#167;1011.5.5.3. RISER FACE VERTICAL, OR SLOPED UNDER THE TREAD ABOVE NOT</text>
  <text class="n" x="994" y="1046">MORE THAN 30 DEGREES FROM VERTICAL &#8212; &#167;1011.5.5.</text>
  <text class="n" x="960" y="1074">9.</text>
  <text class="n" x="994" y="1074">HEADROOM 80" MIN, MEASURED VERTICALLY FROM THE LINE CONNECTING THE TREAD NOSINGS &#8212; &#167;1011.3.</text>
  <text class="n" x="994" y="1092">STAIR WIDTH PER PLAN, 36" MIN AT AN OCCUPANT LOAD UNDER 50 &#8212; &#167;1011.2. HANDRAIL AND GUARD PER</text>
  <text class="n" x="994" y="1110">THE HANDRAIL DETAIL.</text>
  <text class="n" x="960" y="1138">10.</text>
  <text class="n" x="994" y="1138">STRINGERS, BLOCKING, FASTENING AND ANCHORAGE PER STRUCTURAL. SET TREADS AND RISERS IN</text>
  <text class="n" x="994" y="1156">CONTINUOUS ADHESIVE AND SCREW TO STRINGERS AND BLOCKING; NO EXPOSED FASTENERS ON TREADS.</text>
  <text class="tt" x="100" y="1236">KEYNOTES</text>
  <line class="x" x1="100" y1="1245" x2="1800" y2="1245" stroke-width="1"/>
  <circle cx="115" cy="1268" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="115" y="1273" text-anchor="middle">A</text>
  <text class="n" x="142" y="1272">ENGINEERED WOOD TREAD &#8212; SEE INTERIORS FOR MATERIAL AND FINISH. EASE LEADING EDGE PER NOTE 6.</text>
  <circle cx="115" cy="1294" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="115" y="1299" text-anchor="middle">B</text>
  <text class="n" x="142" y="1298">ENGINEERED WOOD RISER, SOLID PER NOTE 8.</text>
  <circle cx="115" cy="1320" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="115" y="1325" text-anchor="middle">C</text>
  <text class="n" x="142" y="1324">CONTINUOUS WOOD BLOCKING AT EACH TREAD AND RISER JUNCTION.</text>
  <circle cx="115" cy="1346" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="115" y="1351" text-anchor="middle">D</text>
  <text class="n" x="142" y="1350">STAIR STRINGER PER STRUCTURAL &#8212; SEE NOTE 10.</text>
  <circle cx="115" cy="1372" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="115" y="1377" text-anchor="middle">E</text>
  <text class="n" x="142" y="1376">LINE CONNECTING TREAD NOSINGS &#8212; DATUM FOR HEADROOM (NOTE 9) AND FOR HANDRAIL / GUARD HEIGHT.</text>
  <rect x="60" y="1416" width="1780" height="1" fill="#000"/>
  <text class="s" x="60" y="1438">DIMENSIONS ARE TO FINISH SURFACES. VERIFY ALL RISER HEIGHTS AGAINST ACTUAL FINISH FLOOR THICKNESS BEFORE FABRICATION.</text>
  <text class="f" x="1840" y="1438" text-anchor="end">SEE NOTE 2 &#8212; THE 7 1/2" RISER RELIES ON &#167;1011.5.2 EXC. 3</text>
</svg>