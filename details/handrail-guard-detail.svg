  <g id="keynotes">
    <text class="tt" x="760" y="880">KEYNOTES</text>
    <line class="thin" x1="760" y1="889" x2="2040" y2="889" stroke-width="1"/>

    <circle cx="775" cy="916" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="tk" x="775" y="921" text-anchor="middle">A</text>
    <text class="t" x="804" y="913">2" x 2 1/4" SOLID HARDWOOD CAP, SPECIES PER FINISH SCHEDULE. BANDS 3/4" + 1 1/2". TYPE II PROFILE, &#167;1014.3.2.</text>
    <text class="ts" x="804" y="931">PERIMETER 8 1/2" EXCEEDS 6 1/4", SO TYPE I (&#167;1014.3.1) IS NOT AVAILABLE. WIDTH ABOVE RECESS 2" (1 1/4"&#8211;2 3/4").</text>

    <circle cx="775" cy="966" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="tk" x="775" y="971" text-anchor="middle">B</text>
    <text class="t" x="804" y="963">FINGER RECESS, BOTH SIDES, 3/8" DEEP (5/16" MIN), NECK 1 1/4". TOP OF RECESS 3/4" BELOW TOP OF PROFILE - THAT IS THE MAX,</text>
    <text class="ts" x="804" y="981">DO NOT EXCEED. FULL DEPTH CARRIED TO THE BOTTOM OF THE CAP, 2 1/4" BELOW TOP (1 3/4" IS THE MIN). &#167;1014.3.2.</text>

    <circle cx="775" cy="1016" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="tk" x="775" y="1021" text-anchor="middle">C</text>
    <text class="t" x="804" y="1013">BUILT-UP POST 2" WIDE (3/4" + 1/2" + 3/4" PLIES), FLUSH WITH THE CAP. NOTHING TO</text>
    <text class="ts" x="804" y="1031">PROJECT BEYOND THE SIDES OF THE GRIP WITHIN 3/8" OF THE RAIL BOTTOM &#8212; &#167;1014.4 EXC. 3. SEE SHEET NOTE 7.</text>

    <circle cx="775" cy="1066" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="tk" x="775" y="1071" text-anchor="middle">D</text>
    <text class="t" x="804" y="1063">CAP TO SUB-RAIL: #10 x 3" F.H. SCREWS AT 12" O.C. MAX, COUNTERSUNK AND PLUGGED, PLUS CONTINUOUS</text>
    <text class="ts" x="804" y="1081">ADHESIVE. RAIL SHALL NOT ROTATE IN ITS FITTINGS, &#167;1014.5. POST ANCHORAGE PER STRUCTURAL.</text>

    <circle cx="775" cy="1116" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="tk" x="775" y="1121" text-anchor="middle">E</text>
    <text class="t" x="804" y="1113">GUARD POST PLIES GLUED AND SCREWED AS AN ASSEMBLY. GUARD INFILL PER SHEET NOTE 5. WHERE RAIL OCCURS AT A WALL,</text>
    <text class="ts" x="804" y="1131">MAINTAIN 1 1/2" MIN CLEAR BETWEEN GRIP AND WALL &#8212; &#167;1014.7. NO SHARP OR ABRASIVE ELEMENTS.</text>

    <circle cx="775" cy="1166" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="tk" x="775" y="1171" text-anchor="middle">F</text>
    <text class="t" x="804" y="1163">EASE ALL EDGES, R 1/8" TYP. (0.01" MIN, &#167;1014.3.2). SAND SMOOTH; NO SPLINTERS OR EXPOSED FASTENERS.</text>

    <circle cx="775" cy="1206" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="tk" x="775" y="1211" text-anchor="middle">G</text>
    <text class="t" x="804" y="1203">RAIL ASSEMBLY MAY PROJECT 4 1/2" MAX INTO THE REQUIRED STAIR WIDTH AT EACH SIDE &#8212; &#167;1014.8.</text>
  </g>

  <g>
    <rect x="60" y="60" width="1980" height="1" fill="#000"/>
    <text class="tt" x="60" y="46">HANDRAIL / GUARD DETAIL &#8212; INTERIOR STAIR, SINGLE-FAMILY (IBC GROUP R-3)</text>
    <text class="ts" x="2040" y="46" text-anchor="end">2021 IBC AS ADOPTED AND AMENDED &#183; ASPEN M.C. CH. 8.20 &#183; IRC NOT ADOPTED (&#167;8.16.010)</text>
    <rect x="60" y="1262" width="1980" height="1" fill="#000"/>
    <text class="ts" x="60" y="1284">DIMENSIONS GOVERN. VERIFY ALL CODE DIMENSIONS AGAINST THE ADOPTED CODE PRIOR TO FABRICATION.</text>
    <text class="flag" x="2040" y="1284" text-anchor="end">SEE SHEET NOTE 3 &#8212; CONFIRM GUARD HEIGHT WITH ASPEN BUILDING DEPT. BEFORE ISSUE</text>
  </g>
