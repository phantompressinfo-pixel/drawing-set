    <text class="ts" x="596" y="466" text-anchor="end">4 3/8" SPHERE MAX &#8212; &#167;1015.4 EXC. 6</text>
    <text class="ts" x="596" y="482" text-anchor="end">(OPEN SIDE OF STAIR, R-3 DWELLING)</text>

    <circle cx="808" cy="580" r="18" fill="none" stroke="#000" stroke-width="0.6" stroke-dasharray="5 3"/>
    <line class="lead" x1="600" y1="580" x2="789" y2="580"/>
    <text class="ts" x="596" y="576" text-anchor="end">6" SPHERE MAX AT TRIANGULAR</text>
    <text class="ts" x="596" y="592" text-anchor="end">OPENING &#8212; &#167;1015.4 EXC. 2</text>

    <line class="lead" x1="600" y1="380" x2="784" y2="404"/>
    <text class="ts" x="596" y="360" text-anchor="end">GRIP CONTINUOUS &#8212; &#167;1014.4.</text>
    <text class="ts" x="596" y="376" text-anchor="end">RETURN TO NEWEL / WALL AT ENDS &#8212; &#167;1014.6.</text>
