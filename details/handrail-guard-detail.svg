    <marker id="tick" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <line x1="2.5" y1="9.5" x2="9.5" y2="2.5" stroke="#000" stroke-width="0.9"/>
    </marker>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="1.8" fill="#000"/>
    </marker>
    <style>
