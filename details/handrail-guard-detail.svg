    <text class="tt" x="80" y="1005">1 &#8212; HANDRAIL / GUARD CAP AT OPEN SIDE OF STAIR</text>
    <line class="thin" x1="80" y1="1014" x2="640" y2="1014" stroke-width="1"/>
    <text class="ts" x="80" y="1038">SECTION &#183; DIMENSIONS GOVERN &#183; DRAW FULL SIZE IN CAD</text>
    <text class="ts" x="80" y="1058">TYPE II GRASPABLE PROFILE PER 2021 IBC &#167;1014.3.2</text>
    <text class="ts" x="80" y="1078">PERIMETER 8 1/2" &gt; 6 1/4" &#8594; FINGER RECESS BOTH SIDES REQUIRED</text>
    <text class="tt" x="80" y="1122">GOVERNING LIMITS &#8212; DO NOT DRIFT</text>
    <line class="thin" x1="80" y1="1131" x2="640" y2="1131" stroke-width="1"/>
    <text class="ts" x="80" y="1153">3/4" MAX, TOP OF PROFILE TO TOP OF RECESS &#183; &#167;1014.3.2</text>
    <text class="ts" x="80" y="1171">1 3/4" MIN, TOP OF PROFILE TO BOTTOM OF RECESS &#183; &#167;1014.3.2</text>
    <text class="ts" x="80" y="1189">5/16" MIN RECESS DEPTH, BOTH SIDES &#183; &#167;1014.3.2</text>
    <text class="ts" x="80" y="1207">NOTHING TO PROJECT BEYOND THE SIDES OF THE GRIP WITHIN 3/8"</text>
    <text class="ts" x="80" y="1225">OF THE BOTTOM OF THE RAIL &#183; &#167;1014.4 EXC. 3 AT AN 8 1/2" PERIMETER</text>
  </g>

