      .hid  { fill:none; stroke:#000; stroke-width:1; stroke-dasharray:7 4; }
      .ext  { fill:none; stroke:#333; stroke-width:0.8; }
      .dim  { fill:none; stroke:#333; stroke-width:0.9; marker-start:url(#tick); marker-end:url(#tick); }
      .lead { fill:none; stroke:#333; stroke-width:0.9; marker-end:url(#dot); }
      .t    { font-size:15px; fill:#111; }
      .td   { font-size:15px; fill:#333; }
      .ts   { font-size:13px; fill:#333; }
      .tt   { font-size:20px; fill:#000; letter-spacing:1px; }
      .tk   { font-size:13px; fill:#111; font-weight:bold; }
      .flag { font-size:13px; fill:#000; font-weight:bold; }
    </style>
  </defs>

