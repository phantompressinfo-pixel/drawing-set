    <text class="tt" x="80" y="1005">1 &#8212; HANDRAIL / GUARD CAP AT OPEN SIDE OF STAIR</text>
    <line class="thin" x1="80" y1="1014" x2="640" y2="1014" stroke-width="1"/>
    <text class="ts" x="80" y="1038">SECTION &#183; DIMENSIONS GOVERN &#183; DRAW FULL SIZE IN CAD</text>
    <text class="ts" x="80" y="1058">TYPE II GRASPABLE PROFILE PER 2021 IBC &#167;1014.3.2</text>
    <text class="ts" x="80" y="1078">PERIMETER 10 1/2" &gt; 6 1/4" &#8594; FINGER RECESS BOTH SIDES REQUIRED</text>
