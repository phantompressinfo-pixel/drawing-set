  <text class="tt" x="180" y="928">1 &#8212; HANDRAIL / GUARD CAP AT OPEN SIDE OF STAIR</text>
  <line class="x" x1="180" y1="937" x2="850" y2="937" stroke-width="1"/>
  <text class="s" x="180" y="959">SECTION &#183; DIMENSIONS GOVERN &#183; DRAW FULL SIZE IN CAD</text>
  <text class="s" x="180" y="979">TYPE I NON-CIRCULAR PROFILE PER 2021 IBC &#167;1014.3.1 &#8212; NO FINGER RECESS REQUIRED. SEE NOTE 6.</text>
  

  <line x1="900" y1="120" x2="900" y2="985" stroke="#000" stroke-width="0.4"/>

  <text class="tt" x="950" y="170">GENERAL NOTES</text>
  <line class="x" x1="950" y1="179" x2="1840" y2="179" stroke-width="1"/>
  <text class="n" x="950" y="205">1.</text>
  <text class="n" x="982" y="205">CODE BASIS. 2021 IBC AS ADOPTED AND AMENDED BY ASPEN M.C. CH. 8.20. THE CITY DID NOT ADOPT THE IRC (&#167;8.16.010),</text>
  <text class="n" x="982" y="223">SO RESIDENTIAL WORK RUNS UNDER THE IBC AS GROUP R-3. DO NOT CITE IRC SECTIONS ON THIS SHEET.</text>
  <text class="n" x="950" y="251">2.</text>
  <text class="n" x="982" y="251">HANDRAIL ONE SIDE MINIMUM AT STAIRS WITHIN THE DWELLING &#8212; &#167;1011.11 EXCEPTION.</text>
  <text class="n" x="950" y="279">3.</text>
  <text class="n" x="982" y="279">HEIGHT 34" MIN / 38" MAX, UNIFORM, ABOVE THE LINE CONNECTING TREAD NOSINGS. WHERE THE TOP OF THE GUARD IS THE</text>
  <text class="n" x="982" y="297">HANDRAIL AT AN OPEN SIDE, SAME 34"&#8211;38" (&#167;1014.2, &#167;1015.3 EXC. 3). GUARD AT LANDINGS AND FLOORS 36" MIN (&#167;1015.3 EXC. 1).</text>
  <text class="f" x="982" y="315">** CONFIRM WITH ASPEN BUILDING DEPT. &#8212; OFFICE SETS HAVE USED 42". **</text>
  <text class="n" x="950" y="343">4.</text>
  <text class="n" x="982" y="343">GUARDS REQUIRED WHERE THE DROP EXCEEDS 30", MEASURED WITHIN 36" HORIZONTALLY OF THE OPEN SIDE &#8212; &#167;1015.2 AS</text>
  <text class="n" x="982" y="361">AMENDED BY ASPEN M.C. &#167;8.20.020.</text>
  <text class="n" x="950" y="389">5.</text>
  <text class="n" x="982" y="389">GUARD OPENINGS: 4 3/8" SPHERE MAX AT OPEN SIDES OF STAIRS, 6" MAX AT THE TRIANGULAR OPENING FORMED BY RISER,</text>
  <text class="n" x="982" y="407">TREAD AND BOTTOM RAIL, 4" MAX ELSEWHERE &#8212; &#167;1015.4.</text>
  <text class="n" x="950" y="435">6.</text>
  <text class="n" x="982" y="435">GRIP: 2" x 1 1/8" CAP, EDGES EASED R 3/8". TYPE I NON-CIRCULAR PER &#167;1014.3.1 &#8212; PERIMETER 6 1/4" MAX, CROSS SECTION</text>
  <text class="n" x="982" y="453">2 1/4" MAX AND 1" MIN. NO FINGER RECESS REQUIRED. ONLY THE CAP IS MEASURED; THE SUB-RAIL BELOW IS NOT PART</text>
  <text class="n" x="982" y="471">OF THE GRIP.</text>
  <text class="n" x="950" y="499">7.</text>
  <text class="n" x="982" y="499">GRIP CONTINUOUS; MAY BE INTERRUPTED BY A NEWEL AT A TURN OR LANDING (&#167;1014.4 EXC. 1). RETURN TO WALL, GUARD OR</text>
  <text class="n" x="982" y="517">NEWEL AT BOTH ENDS; WITHIN A DWELLING THE RAIL NEED RUN ONLY FROM THE TOP RISER TO THE BOTTOM RISER</text>
  <text class="n" x="982" y="535">(&#167;1014.6 EXC. 1). NOTHING TO STAND PROUD OF THE CAP WITHIN 1 1/4" OF ITS UNDERSIDE (&#167;1014.4 EXC. 3). 1 1/2" MIN CLEAR</text>
  <text class="n" x="982" y="553">TO ANY WALL (&#167;1014.7). RAIL SHALL NOT ROTATE IN ITS FITTINGS (&#167;1014.5).</text>
  <text class="n" x="950" y="581">8.</text>
  <text class="n" x="982" y="581">DESIGN FOR A 200 LB CONCENTRATED LOAD APPLIED IN ANY DIRECTION AT THE TOP; INFILL FOR 50 LB ON 1 S.F. &#8212;</text>
  <text class="n" x="982" y="599">&#167;1607.9.1. SOLID BLOCKING AT ALL ANCHORAGE POINTS; POST ANCHORAGE PER STRUCTURAL.</text>
  <text class="n" x="950" y="627">9.</text>
  <text class="n" x="982" y="627">HARDWOOD CAP, SPECIES AND FINISH PER SCHEDULE, KILN DRIED. FASTENERS COUNTERSUNK AND PLUGGED &#8212; NO EXPOSED</text>
  <text class="n" x="982" y="645">FASTENERS ON THE GRIP. SAND ALL GRASPABLE SURFACES SMOOTH.</text>
  <text class="tt" x="950" y="697">KEYNOTES</text>
  <line class="x" x1="950" y1="706" x2="1840" y2="706" stroke-width="1"/>
  <circle cx="965" cy="729" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="965" y="734" text-anchor="middle">A</text>
  <text class="n" x="992" y="733">2" x 1 1/8" HARDWOOD CAP, EDGES EASED R 3/8" TYP. THE EASING IS WHAT KEEPS THE PERIMETER UNDER 6 1/4" &#8212; SEE NOTE 6.</text>
  <circle cx="965" cy="759" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="965" y="764" text-anchor="middle">B</text>
  <text class="n" x="992" y="763">BOTTOM OF RAIL. THE GRIP IS THE CAP ONLY; NOTHING BELOW THIS LINE COUNTS TOWARD THE PERIMETER &#8212; SEE NOTE 6.</text>
  <circle cx="965" cy="789" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="965" y="794" text-anchor="middle">C</text>
  <text class="n" x="992" y="793">SUB-RAIL 1 1/4" WIDE x 1 1/4" TALL MIN, INSET 3/8" EACH SIDE &#8212; SEE NOTE 7.</text>
  <circle cx="965" cy="819" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="965" y="824" text-anchor="middle">D</text>
  <text class="n" x="992" y="823">CAP TO SUB-RAIL: #10 x 3" F.H. SCREWS AT 12" O.C. MAX, COUNTERSUNK AND PLUGGED, PLUS CONTINUOUS ADHESIVE.</text>
  <circle cx="965" cy="849" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="965" y="854" text-anchor="middle">E</text>
  <text class="n" x="992" y="853">BUILT-UP GUARD POST, 2 1/4" (THREE 3/4" PLIES) GLUED AND SCREWED. FULL WIDTH ONLY BELOW THE SUB-RAIL.</text>
  <circle cx="965" cy="879" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="965" y="884" text-anchor="middle">F</text>
  <text class="n" x="992" y="883">GUARD INFILL PER NOTE 5. ANCHORAGE AND BLOCKING PER NOTE 8 AND STRUCTURAL DRAWINGS.</text>

  <rect x="60" y="1005" width="1780" height="1" fill="#000"/>
  <text class="s" x="60" y="1027">DIMENSIONS GOVERN. VERIFY ALL CODE DIMENSIONS AGAINST THE ADOPTED CODE PRIOR TO FABRICATION.</text>
  <text class="f" x="1840" y="1027" text-anchor="end">SEE SHEET NOTE 3 &#8212; CONFIRM GUARD HEIGHT WITH ASPEN BUILDING DEPT. BEFORE ISSUE</text>
</svg>
