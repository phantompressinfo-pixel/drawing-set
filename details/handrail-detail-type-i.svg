  <text class="tt" x="180" y="960">1 &#8212; HANDRAIL / GUARD CAP AT OPEN SIDE OF STAIR</text>
  <line class="x" x1="180" y1="969" x2="850" y2="969" stroke-width="1"/>
  <text class="s" x="180" y="991">SECTION &#183; DIMENSIONS GOVERN &#183; DRAW FULL SIZE IN CAD</text>
  <text class="s" x="180" y="1011">TYPE I NON-CIRCULAR PROFILE PER 2021 IBC &#167;1014.3.1 &#8212; NO FINGER RECESS REQUIRED</text>
  <text class="s" x="180" y="1031">THE HANDRAIL IS THE 2" x 1 1/8" CAP ONLY; THE SUB-RAIL BELOW IS NOT PART OF THE GRIP</text>

  <line x1="900" y1="120" x2="900" y2="1060" stroke="#000" stroke-width="0.4"/>

  <text class="tt" x="960" y="170">TYPE I CRITERIA &#8212; &#167;1014.3.1</text>
  <line class="x" x1="960" y1="179" x2="1840" y2="179" stroke-width="1"/>
  <text class="n" x="960" y="203">PERIMETER</text><text class="n" x="1240" y="203">4" MIN / 6 1/4" MAX</text><text class="n" x="1500" y="203">5.61" AT R 3/8" &#183; 6 1/4" MILLED SQUARE &#8212; OK</text>
  <text class="n" x="960" y="225">MAX CROSS-SECTIONAL DIM.</text><text class="n" x="1240" y="225">2 1/4" MAX</text><text class="n" x="1500" y="225">2" &#8212; OK</text>
  <text class="n" x="960" y="247">MIN CROSS-SECTIONAL DIM.</text><text class="n" x="1240" y="247">1" MIN</text><text class="n" x="1500" y="247">1 1/8" &#8212; OK</text>
  <text class="n" x="960" y="269">EDGE RADIUS</text><text class="n" x="1240" y="269">0.01" MIN</text><text class="n" x="1500" y="269">R 3/8" &#8212; OK</text>

  <text class="tt" x="960" y="325">NECK CLEAR ZONE &#8212; &#167;1014.4 EXC. 3</text>
  <line class="x" x1="960" y1="334" x2="1840" y2="334" stroke-width="1"/>
  <text class="s" x="960" y="357">1 1/2" REDUCED 1/8" FOR EACH 1/2" OF HANDRAIL PERIMETER OVER 4". A SMALLER PERIMETER IS STRICTER:</text>
  <text class="s" x="960" y="379">MILLED SQUARE, P = 6 1/4" &#8594; 15/16" &#183; AT R 3/8", P = 5.61" &#8594; 1 3/32" &#183; FULLY BULLNOSED, P = 5.28" &#8594; 1 3/16"</text>
  <text class="f" x="960" y="401">NECK DRAWN 1 1/4" TALL &#8212; GOVERNS ALL THREE. DO NOT REDUCE.</text>

  <text class="tt" x="960" y="457">KEYNOTES</text>
  <line class="x" x1="960" y1="466" x2="1840" y2="466" stroke-width="1"/>
  <circle cx="975" cy="493" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="975" y="498" text-anchor="middle">A</text>
  <text class="n" x="1004" y="490">2" x 1 1/8" SOLID HARDWOOD CAP, SPECIES PER FINISH SCHEDULE. THIS IS THE ENTIRE GRASPABLE MEMBER.</text>
  <text class="s" x="1004" y="508">TYPE I NON-CIRCULAR PER &#167;1014.3.1 &#8212; NO FINGER RECESS REQUIRED.</text>

  <circle cx="975" cy="543" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="975" y="548" text-anchor="middle">B</text>
  <text class="n" x="1004" y="540">EASE ALL EDGES R 3/8" TYP. (0.01" MIN). PERIMETER MUST NOT EXCEED 6 1/4" &#8212; MILLED DEAD SQUARE THIS</text>
  <text class="s" x="1004" y="558">PROFILE IS EXACTLY 6 1/4", SO THE RADIUS IS NOT OPTIONAL. SAND SMOOTH; NO SPLINTERS.</text>

  <circle cx="975" cy="593" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="975" y="598" text-anchor="middle">C</text>
  <text class="n" x="1004" y="590">BOTTOM OF RAIL. NOTHING BELOW THIS LINE IS PART OF THE GRIP OR COUNTS TOWARD THE PERIMETER.</text>
  <text class="s" x="1004" y="608">MEASURED AS ONE 2" x 2 3/8" SECTION THE SAME ASSEMBLY WOULD BE OVER 6 1/4" AND FORCE TYPE II.</text>

  <circle cx="975" cy="643" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="975" y="648" text-anchor="middle">D</text>
  <text class="n" x="1004" y="640">SUB-RAIL / NECK, 1 1/4" WIDE x 1 1/4" TALL MIN, INSET 3/8" EACH SIDE. NOTHING TO PROJECT BEYOND THE</text>
  <text class="s" x="1004" y="658">SIDES OF THE GRIP WITHIN 1 1/4" OF THE BOTTOM OF THE RAIL &#8212; &#167;1014.4 EXC. 3. SEE SHEET NOTE 7.</text>

  <circle cx="975" cy="693" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="975" y="698" text-anchor="middle">E</text>
  <text class="n" x="1004" y="690">CAP TO SUB-RAIL: #10 x 3" F.H. SCREWS AT 12" O.C. MAX, COUNTERSUNK AND PLUGGED, PLUS CONTINUOUS</text>
  <text class="s" x="1004" y="708">ADHESIVE. RAIL SHALL NOT ROTATE IN ITS FITTINGS, &#167;1014.5. NO EXPOSED FASTENERS ON THE GRIP.</text>

  <circle cx="975" cy="743" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="975" y="748" text-anchor="middle">F</text>
  <text class="n" x="1004" y="740">BUILT-UP GUARD POST, 2 1/4" (THREE 3/4" PLIES), GLUED AND SCREWED AS AN ASSEMBLY. MAY RETURN TO</text>
  <text class="s" x="1004" y="758">FULL WIDTH ONLY BELOW THE 1 1/4" NECK. GUARD INFILL PER SHEET NOTE 5. ANCHORAGE PER STRUCTURAL.</text>

  <circle cx="975" cy="793" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="975" y="798" text-anchor="middle">G</text>
  <text class="n" x="1004" y="790">RAIL ASSEMBLY MAY PROJECT 4 1/2" MAX INTO THE REQUIRED STAIR WIDTH AT EACH SIDE &#8212; &#167;1014.8.</text>
  <text class="s" x="1004" y="808">WHERE THE RAIL OCCURS AT A WALL, MAINTAIN 1 1/2" MIN CLEAR BETWEEN GRIP AND WALL &#8212; &#167;1014.7.</text>

  <text class="tt" x="960" y="864">UNCHANGED BY THE TYPE I SWITCH</text>
  <line class="x" x1="960" y1="873" x2="1840" y2="873" stroke-width="1"/>
  <text class="s" x="960" y="896">HEIGHT 34"&#8211;38" ABOVE THE LINE CONNECTING TREAD NOSINGS &#183; &#167;1014.2 AND &#167;1015.3 EXC. 3</text>
  <text class="s" x="960" y="916">GUARDS REQUIRED OVER A 30" DROP WITHIN 36" HORIZONTALLY &#183; &#167;1015.2 AS AMENDED BY ASPEN M.C. &#167;8.20.020</text>
  <text class="s" x="960" y="936">GUARD OPENINGS: 4 3/8" SPHERE AT OPEN SIDES OF STAIRS, 6" AT TRIANGULAR OPENINGS, 4" AT LANDINGS &#183; &#167;1015.4</text>
  <text class="s" x="960" y="956">CONTINUITY &#183; &#167;1014.4 &#183; RETURNS AND EXTENSIONS &#183; &#167;1014.6 &#183; LOADS &#183; &#167;1607.9</text>
  <text class="s" x="960" y="976">SEE HANDRAIL-GUARD-DETAIL FOR THE PARTIAL STAIR SECTION AND SHEET NOTES 1&#8211;13.</text>

  <rect x="60" y="1080" width="1780" height="1" fill="#000"/>
  <text class="s" x="60" y="1102">DIMENSIONS GOVERN. VERIFY ALL CODE DIMENSIONS AGAINST THE ADOPTED CODE PRIOR TO FABRICATION.</text>
  <text class="f" x="1840" y="1102" text-anchor="end">SEE SHEET NOTE 3 &#8212; CONFIRM GUARD HEIGHT WITH ASPEN BUILDING DEPT. BEFORE ISSUE</text>
</svg>
