  <rect x="0" y="0" width="1920" height="1295" fill="#fff"/>
  <rect x="60" y="60" width="1800" height="1" fill="#000"/>
  <text class="tt" x="60" y="46">5/A6.31 &#183; WOOD RISER &amp; HANDRAIL AT MAIN &#8212; UPPER LEVEL &#183; SECTION CUT ACROSS THE STAIR</text>
  <text class="s" x="1860" y="46" text-anchor="end">THIS VIEW GOVERNS WIDTH, CLEARANCE AND TREAD BEARING &#183; RISE AND RUN PER 4/A6.31</text>
  <rect x="440.0" y="170.0" width="60.0" height="33.8" rx="13.5" ry="13.5" fill="url(#hx)" stroke="#000" stroke-width="1.4"/>
  <rect x="451.2" y="203.8" width="37.5" height="37.5" fill="url(#hx)" stroke="#000" stroke-width="1.4"/>
  <rect x="395.0" y="241.2" width="150.0" height="188.8" fill="url(#wg)" stroke="#000" stroke-width="1.4"/>
