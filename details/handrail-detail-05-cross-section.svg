  <path class="x" d="M 395.0 520.0 L 430.0 520.0 L 454.0 498.0 L 484.0 546.0 L 508.0 520.0 L 545.0 520.0" stroke-width="1.1"/>
  <rect x="409.0" y="241.2" width="122.0" height="75.0" fill="url(#hx)" stroke="#000" stroke-width="1.2"/>
  <rect x="409.0" y="620.0" width="122.0" height="105.0" fill="url(#hx)" stroke="#000" stroke-width="1.2"/>
  <rect x="350.0" y="687.5" width="45.0" height="45.0" fill="url(#hx)" stroke="#000" stroke-width="1.4"/>
  <rect x="150" y="650.0" width="245.0" height="37.5" fill="url(#wg)" stroke="#000" stroke-width="1.6"/>
  <path class="x" d="M 186 650.0 L 186 664.0 L 162 672.0 L 210 680.0 L 186 687.0 L 186 687.5" stroke-width="1.1"/>
  <rect x="150" y="980.0" width="515.0" height="24.0" fill="url(#hx)" stroke="#000" stroke-width="1.2"/>
  <line class="x" x1="500.0" y1="170.0" x2="739.0" y2="170.0"/>
  <line class="x" x1="545.0" y1="650.0" x2="739.0" y2="650.0"/>
  <line class="d" x1="725.0" y1="170.0" x2="725.0" y2="650.0"/>
  <text class="f" x="718.0" y="410.0" text-anchor="middle" transform="rotate(-90 718.0 410.0)">34" MIN / 38" MAX</text>
  <line class="x" x1="312.0" y1="203.8" x2="445.2" y2="203.8"/>
  <line class="x" x1="312.0" y1="241.2" x2="389.0" y2="241.2"/>
  <line class="d" x1="320.0" y1="203.8" x2="320.0" y2="241.2"/>
  <text class="f" x="280.0" y="219.8" text-anchor="end">1 1/4" MIN</text>
  <text class="s" x="280.0" y="236.8" text-anchor="end">NOTHING PROUD OF THE</text>
  <text class="s" x="280.0" y="253.8" text-anchor="end">CAP WITHIN THIS ZONE</text>
  <line class="x" x1="440.0" y1="162.0" x2="440.0" y2="118.0"/>
  <line class="x" x1="500.0" y1="162.0" x2="500.0" y2="118.0"/>
  <line class="d" x1="440.0" y1="130.0" x2="500.0" y2="130.0"/>
  <text class="n" x="470.0" y="124.0" text-anchor="middle">2"</text>
  <line class="x" x1="395.0" y1="640.0" x2="395.0" y2="580.0"/>
  <line class="x" x1="150" y1="640.0" x2="150" y2="580.0"/>
  <line class="d" x1="150" y1="594.0" x2="395.0" y2="594.0"/>
  <text class="n" x="272.5" y="588.0" text-anchor="middle">CLEAR STAIR WIDTH PER PLAN</text>
  <text class="s" x="272.5" y="570.0" text-anchor="middle">MEASURE TO FINISH FACES, RAIL IN PLACE &#8212; NOTE 1</text>
  <line class="l" x1="640" y1="190" x2="498" y2="190"/><circle cx="656" cy="186" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="656" y="191" text-anchor="middle">A</text>
  <line class="l" x1="640" y1="272" x2="529" y2="272"/><circle cx="656" cy="268" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="656" y="273" text-anchor="middle">D</text>
  <line class="l" x1="640" y1="400" x2="537" y2="400"/><circle cx="656" cy="396" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="656" y="401" text-anchor="middle">B</text>
  <line class="l" x1="112" y1="670.0" x2="300" y2="670"/><circle cx="96" cy="666.0" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="96" y="671.0" text-anchor="middle">C</text>
  <line class="l" x1="112" y1="733.5" x2="387" y2="710"/><circle cx="96" cy="729.5" r="14" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="96" y="734.5" text-anchor="middle">E</text>
  <text class="tt" x="150" y="1058">5 &#8212; WOOD RISER &amp; HANDRAIL AT MAIN - UPPER LEVEL</text>
  <line class="x" x1="150" y1="1067" x2="700" y2="1067" stroke-width="1"/>
  <text class="s" x="150" y="1089">SECTION CUT ACROSS THE RUN &#183; DIMENSIONS GOVERN &#183; DRAW FULL SIZE IN CAD</text>
  <line x1="740" y1="140" x2="740" y2="1205" stroke="#000" stroke-width="0.4"/>
  <text class="tt" x="780" y="170">WIDTH AND CLEARANCES</text>
  <line class="x" x1="780" y1="179" x2="1860" y2="179" stroke-width="1"/>
  <text class="n" x="780" y="202">1.</text>
  <text class="n" x="812" y="202">CLEAR STAIR WIDTH PER PLAN. MEASURE BETWEEN FINISH FACES, NOT BETWEEN FRAMING. VERIFY AFTER WALL FINISH IS ON AND WITH THE</text>
  <text class="n" x="812" y="219">HANDRAIL IN PLACE &#8212; NOT BEFORE.</text>
  <text class="n" x="780" y="245">2.</text>
  <text class="n" x="812" y="245">WHERE A HANDRAIL OCCURS AT A WALL FACE, MAINTAIN 1 1/2" MIN CLEAR BETWEEN THE GRIP AND THE WALL FINISH FOR THE FULL LENGTH</text>
  <text class="n" x="812" y="262">OF THE RAIL. HOLD THIS AT TRIM, BASE, AND AT ANY WALL-MOUNTED ITEM.</text>
  <text class="n" x="780" y="288">3.</text>
  <text class="n" x="812" y="288">THE HANDRAIL AND ITS SUPPORTS MAY PROJECT 4 1/2" MAX INTO THE REQUIRED STAIR WIDTH AT EACH SIDE.</text>
  <text class="n" x="780" y="314">4.</text>
  <text class="n" x="812" y="314">NOTHING ELSE TO ENCROACH ON THE STAIR WIDTH WITHIN THE RUN &#8212; NO TRIM, WALL SCONCES, SWITCHES, THERMOSTATS, ART HOOKS OR</text>
  <text class="n" x="812" y="331">SHELVING. COORDINATE WITH INTERIORS AND ELECTRICAL.</text>
  <text class="n" x="780" y="357">5.</text>
  <text class="n" x="812" y="357">THE WALL BELOW THE RAIL IS WIDER THAN THE GRIP. THE 1 1/4" NECK IS WHAT KEEPS THE WALL SHOULDER OUT OF THE FINGER ZONE.</text>
  <text class="n" x="812" y="374">DO NOT REDUCE IT. SEE 3/A6.31.</text>
  <text class="tt" x="780" y="414">WALL, BLOCKING AND TREAD BEARING</text>
  <line class="x" x1="780" y1="423" x2="1860" y2="423" stroke-width="1"/>
  <text class="n" x="780" y="446">6.</text>
  <text class="n" x="812" y="446">STAIR WALL FRAMING AND ALL BLOCKING PER STRUCTURAL. PROVIDE CONTINUOUS SOLID BLOCKING FOR THE FULL LENGTH OF THE HANDRAIL</text>
  <text class="n" x="812" y="463">AND AT EVERY TREAD BEARING POINT.</text>
  <text class="n" x="780" y="489">7.</text>
  <text class="n" x="812" y="489">TREADS TO BEAR ON A CONTINUOUS LEDGER OR HOUSED STRINGER AT THE WALL. DO NOT BEAR TREADS ON GYPSUM BOARD, TRIM OR SHIMS ALONE.</text>
  <text class="n" x="780" y="515">8.</text>
  <text class="n" x="812" y="515">SCRIBE TREADS AND RISERS TIGHT TO THE FINISHED WALL. NO GAPS AND NO CAULK-FILLED JOINTS AT THE TREAD ENDS.</text>
  <text class="n" x="780" y="541">9.</text>
  <text class="n" x="812" y="541">WALL FINISH TO BE COMPLETE AND CONTINUOUS BEHIND THE HANDRAIL AND BEHIND THE STAIR BEFORE TREADS ARE SET. DO NOT STOP FINISH</text>
  <text class="n" x="812" y="558">AT THE STAIR AND PATCH LATER.</text>
  <text class="n" x="780" y="584">10.</text>
  <text class="n" x="812" y="584">CONFIRM ALL BLOCKING IS IN PLACE AND RECORDED BEFORE THE WALL IS CLOSED. NO ELECTRICAL BOXES, LOW VOLTAGE DEVICES OR PIPING</text>
  <text class="n" x="812" y="601">WITHIN THE BLOCKING ZONE.</text>
  <text class="tt" x="780" y="641">HANDRAIL</text>
  <line class="x" x1="780" y1="650" x2="1860" y2="650" stroke-width="1"/>
  <text class="n" x="780" y="673">11.</text>
  <text class="n" x="812" y="673">HANDRAIL HEIGHT 34" MIN / 38" MAX ABOVE THE LINE CONNECTING THE TREAD NOSINGS, AS DIMENSIONED. HOLD ONE HEIGHT FOR THE FULL FLIGHT.</text>
  <text class="n" x="780" y="699">12.</text>
  <text class="n" x="812" y="699">HANDRAIL ON ONE SIDE MINIMUM. WHERE A RAIL OCCURS ON BOTH SIDES, HOLD BOTH AT THE SAME HEIGHT AND THE SAME PROFILE.</text>
  <text class="n" x="780" y="725">13.</text>
  <text class="n" x="812" y="725">HANDRAIL CONTINUOUS FOR THE FULL FLIGHT, RETURNING TO THE WALL AT BOTH ENDS. THE RAIL SHALL NOT ROTATE OR DEFLECT IN ITS FITTINGS.</text>
  <text class="n" x="780" y="751">14.</text>
  <text class="n" x="812" y="751">SEE 3/A6.31 FOR HANDRAIL PROFILE AND DIMENSIONS.</text>
  <text class="tt" x="780" y="791">MATERIALS, WORKMANSHIP AND GENERAL</text>
  <line class="x" x1="780" y1="800" x2="1860" y2="800" stroke-width="1"/>
  <text class="n" x="780" y="823">15.</text>
  <text class="n" x="812" y="823">ALL WOOD KILN DRIED AND ACCLIMATED TO INTERIOR CONDITIONS A MINIMUM OF 72 HOURS BEFORE INSTALLATION. DO NOT INSTALL FINISH</text>
  <text class="n" x="812" y="840">WOODWORK UNTIL THE BUILDING IS DRIED IN.</text>
  <text class="n" x="780" y="866">16.</text>
  <text class="n" x="812" y="866">COUNTERSINK AND PLUG ALL FASTENERS. NO EXPOSED FASTENERS ON THE HANDRAIL, THE TREADS OR ANY SURFACE WITHIN REACH. SAND ALL</text>
  <text class="n" x="812" y="883">EXPOSED SURFACES AND EDGES SMOOTH.</text>
  <text class="n" x="780" y="909">17.</text>
  <text class="n" x="812" y="909">SEE INTERIORS DRAWINGS FOR ALL FINISH MATERIALS, SPECIES, STAIN AND SHEEN.</text>
  <text class="n" x="780" y="935">18.</text>
  <text class="n" x="812" y="935">PROTECT ALL FINISHED WORK UNTIL SUBSTANTIAL COMPLETION. DO NOT USE FINISHED TREADS AS CONSTRUCTION STAIRS.</text>
  <text class="n" x="780" y="961">19.</text>
  <text class="n" x="812" y="961">FIELD VERIFY ALL DIMENSIONS AND CONDITIONS BEFORE FABRICATION. SUBMIT SHOP DRAWINGS FOR THE STAIR AND HANDRAIL ASSEMBLY &#8212;</text>
  <text class="n" x="812" y="978">PROFILES, JOINTS, SPLICES, RETURNS, TREAD BEARING AND ATTACHMENT &#8212; FOR REVIEW PRIOR TO FABRICATION.</text>
  <text class="n" x="780" y="1004">20.</text>
  <text class="n" x="812" y="1004">THE RISER DIMENSION SHOWN IS FOR REFERENCE ONLY. RISER HEIGHT AND COUNT ARE SET BY THE STAIR SECTION AT GRID 6-7 AND ITS</text>
  <text class="n" x="812" y="1021">RISER TABLE. DO NOT SCALE.</text>
  <text class="tt" x="780" y="1061">KEYNOTES</text>
  <line class="x" x1="780" y1="1070" x2="1860" y2="1070" stroke-width="1"/>
  <circle cx="793" cy="1091" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="793" y="1096" text-anchor="middle">A</text>
  <text class="n" x="820" y="1095">WOOD HANDRAIL &#8212; SEE 3/A6.31 FOR PROFILE AND DIMENSIONS.</text>
  <circle cx="793" cy="1117" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="793" y="1122" text-anchor="middle">B</text>
  <text class="n" x="820" y="1121">STAIR WALL &#8212; SEE INTERIORS FOR FINISH. FINISH CONTINUOUS BEHIND THE RAIL, NOTE 9.</text>
  <circle cx="793" cy="1143" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="793" y="1148" text-anchor="middle">C</text>
  <text class="n" x="820" y="1147">ENGINEERED WOOD TREAD, SCRIBED TIGHT TO THE FINISHED WALL &#8212; NOTE 8.</text>
  <circle cx="793" cy="1169" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="793" y="1174" text-anchor="middle">D</text>
  <text class="n" x="820" y="1173">CONTINUOUS SOLID WOOD BLOCKING PER STRUCTURAL &#8212; NOTES 6 AND 10.</text>
  <circle cx="793" cy="1195" r="13" fill="#fff" stroke="#000" stroke-width="0.8"/><text class="k" x="793" y="1200" text-anchor="middle">E</text>
  <text class="n" x="820" y="1199">CONTINUOUS LEDGER AT THE WALL &#8212; NOTE 7.</text>
  <rect x="60" y="1243" width="1800" height="1" fill="#000"/>
  <text class="s" x="60" y="1265">FIELD VERIFY ALL DIMENSIONS AND CONDITIONS BEFORE FABRICATION.</text>
</svg>