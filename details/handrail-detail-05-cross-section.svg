  <line class="x" x1="531.0" y1="241.2" x2="531.0" y2="430.0"/>
  <rect x="395.0" y="520.0" width="150.0" height="460.0" fill="url(#wg)" stroke="#000" stroke-width="1.4"/>
  <line class="x" x1="409.0" y1="520.0" x2="409.0" y2="980.0"/>
