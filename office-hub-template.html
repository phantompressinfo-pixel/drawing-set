<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Office Hub — Drawing Set Template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#EEF1F3;
  --surface:#FBFCFC;
  --surface-2:#E3E8EA;
  --ink:#1C2530;
  --ink-muted:#5B6672;
  --hairline:#C9D1D6;
  --hairline-soft:#DEE4E7;
  --accent:#C1432A;
  --accent-ink:#FFFFFF;
  --warn:#B8842A;
  --good:#3E7D5C;
  --focus:#1C2530;
  --shadow: 0 1px 2px rgba(28,37,48,.06), 0 6px 16px rgba(28,37,48,.05);
  --radius:2px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F2A46;
    --surface:#123353;
    --surface-2:#183E63;
    --ink:#E9F1F6;
    --ink-muted:#A9C0D2;
    --hairline:#2C5478;
    --hairline-soft:#1D4468;
    --accent:#F0795F;
    --accent-ink:#12233A;
    --warn:#E0AE55;
    --good:#7FCBA4;
    --focus:#E9F1F6;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#0F2A46;
  --surface:#123353;
  --surface-2:#183E63;
  --ink:#E9F1F6;
  --ink-muted:#A9C0D2;
  --hairline:#2C5478;
  --hairline-soft:#1D4468;
  --accent:#F0795F;
  --accent-ink:#12233A;
  --warn:#E0AE55;
  --good:#7FCBA4;
  --focus:#E9F1F6;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.3);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(0deg, transparent 0 39px, var(--hairline-soft) 39px 40px),
    repeating-linear-gradient(90deg, transparent 0 39px, var(--hairline-soft) 39px 40px),
    var(--paper);
  background-blend-mode: normal;
  color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body{ opacity:1; }
}
h1,h2,h3,h4{
  font-family:"Big Shoulders Display", "Arial Narrow", sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.02em;
  text-wrap:balance;
  margin:0;
  color:var(--ink);
}
.mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;}
a{color:inherit;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ============ TITLE BLOCK HEADER ============ */
.titleblock{
  position:sticky; top:0; z-index:40;
  background:var(--surface);
  border-bottom:2px solid var(--ink);
  box-shadow:var(--shadow);
}
.titleblock-grid{
  max-width:1400px; margin:0 auto;
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  align-items:stretch;
}
.tb-cell{
  border-right:1px solid var(--hairline);
  padding:10px 16px;
  display:flex; flex-direction:column; justify-content:center; gap:2px;
  min-width:0;
}
.tb-cell:last-child{border-right:none;}
.tb-label{
  font-family:"IBM Plex Mono", monospace;
  font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-muted);
}
.tb-firm{gap:0;}
.tb-firm .firm-name{font-size:20px; line-height:1.05;}
.tb-firm .firm-sub{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-muted); letter-spacing:.08em;}
.tb-search{padding:10px 16px; display:flex; align-items:center;}
.search-field{
  position:relative; width:100%; max-width:520px;
}
.search-field input{
  width:100%;
  background:var(--paper);
  border:1px solid var(--hairline);
  border-radius:var(--radius);
  color:var(--ink);
  font-family:"IBM Plex Mono", monospace;
  font-size:13px;
  padding:9px 12px 9px 32px;
}
.search-field input::placeholder{color:var(--ink-muted);}
.search-field svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-muted); pointer-events:none;}
.tb-meta{align-items:flex-end; text-align:right;}
.tb-meta .val{font-family:"IBM Plex Mono",monospace; font-size:12px;}
.tb-actions{flex-direction:row; align-items:center; gap:8px; padding-left:10px; padding-right:14px;}
.icon-btn{
  background:transparent; border:1px solid var(--hairline); border-radius:var(--radius);
  color:var(--ink); width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.icon-btn:hover{background:var(--surface-2);}
.icon-btn svg{width:16px; height:16px;}
.menu-toggle{display:none;}

/* ============ LAYOUT ============ */
.shell{max-width:1400px; margin:0 auto; display:grid; grid-template-columns:238px 1fr; gap:0; min-height:calc(100vh - 58px);}
.sidebar{
  border-right:1px solid var(--hairline);
  padding:18px 0;
  align-self:start;
  position:sticky; top:58px;
  max-height:calc(100vh - 58px); overflow-y:auto;
}
.idx-heading{
  font-family:"IBM Plex Mono", monospace; font-size:10px; letter-spacing:.14em;
  color:var(--ink-muted); text-transform:uppercase; padding:0 18px 8px;
}
.idx-list{list-style:none; margin:0; padding:0;}
.idx-item button{
  width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
  display:flex; gap:10px; align-items:baseline;
  padding:7px 18px; color:var(--ink);
  border-left:3px solid transparent;
  font-size:13.5px;
}
.idx-item .code{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-muted); flex:0 0 auto;}
.idx-item button:hover{background:var(--surface-2);}
.idx-item.active button{border-left-color:var(--accent); background:var(--surface-2); font-weight:600;}
.idx-item.active .code{color:var(--accent);}
.idx-count{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-muted);}

.main{padding:26px 28px 60px; min-width:0;}
.sheet-header{
  display:flex; justify-content:space-between; align-items:flex-end; gap:16px;
  border-bottom:1px solid var(--ink); padding-bottom:12px; margin-bottom:20px;
  flex-wrap:wrap;
}
.sheet-header h1{font-size:30px;}
.sheet-sub{color:var(--ink-muted); font-size:13.5px; max-width:62ch; margin-top:6px;}
.sheet-scale{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-muted); text-align:right; white-space:nowrap;}

.admin-note{
  background:var(--surface); border:1px dashed var(--hairline); border-radius:var(--radius);
  padding:10px 14px; margin-bottom:20px; font-size:12.5px; color:var(--ink-muted);
}
.admin-note strong{color:var(--ink);}

/* card grid */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:14px;}
.card{
  position:relative;
  background:var(--surface);
  border:1px solid var(--hairline);
  border-radius:var(--radius);
  padding:14px 14px 12px;
  display:flex; flex-direction:column; gap:8px;
  box-shadow:var(--shadow);
}
.card::before,.card::after{
  content:""; position:absolute; width:9px; height:9px;
  border-top:1.5px solid var(--ink); border-left:1.5px solid var(--ink);
  top:-1px; left:-1px; opacity:.55;
}
.card::after{ left:auto; right:-1px; border-left:none; border-right:1.5px solid var(--ink); }
.card-top{display:flex; align-items:center; gap:8px;}
.doc-code{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-muted); letter-spacing:.04em;}
.pill{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 6px; border-radius:2px; border:1px solid currentColor;
}
.pill.new{color:var(--accent);}
.pill.updated{color:var(--warn);}
.pill.required{color:var(--good);}
.star-btn{
  margin-left:auto; background:transparent; border:none; cursor:pointer; color:var(--ink-muted);
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;
}
.star-btn svg{width:16px; height:16px;}
.star-btn.pinned{color:var(--accent);}
.card h3{font-size:18px; line-height:1.15;}
.card p{margin:0; font-size:13px; color:var(--ink-muted);}
.tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:auto;}
.tag{
  font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-muted);
  background:var(--surface-2); padding:2px 6px; border-radius:2px;
}
.card-footer{
  display:flex; justify-content:space-between; align-items:center;
  border-top:1px solid var(--hairline-soft); padding-top:8px; margin-top:4px;
  font-size:11.5px; color:var(--ink-muted);
}
.card-footer .open-link{
  font-family:"IBM Plex Mono",monospace; color:var(--accent); text-decoration:none; font-size:11.5px;
}
.card-footer .open-link:hover{text-decoration:underline;}
mark{background:var(--accent); color:var(--accent-ink); padding:0 1px; border-radius:1px;}

.empty{padding:40px 10px; text-align:center; color:var(--ink-muted);}

/* announcements */
.announce{
  border:1px solid var(--hairline); border-left:4px solid var(--accent);
  background:var(--surface); border-radius:var(--radius);
  padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow);
}
.announce.low{border-left-color:var(--hairline);}
.announce.medium{border-left-color:var(--warn);}
.announce-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
.announce-top h4{font-size:15.5px; text-transform:none; letter-spacing:0;}
.announce-date{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-muted); white-space:nowrap;}
.announce p{margin:6px 0 0; font-size:13px; color:var(--ink-muted);}

.section-block{margin-bottom:30px;}
.section-block > h2{font-size:16px; letter-spacing:.06em; color:var(--ink-muted); border-bottom:1px solid var(--hairline-soft); padding-bottom:6px; margin-bottom:12px;}

.home-quick{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:28px;}
.quick-tile{
  border:1px solid var(--hairline); background:var(--surface); border-radius:var(--radius);
  padding:14px 12px; cursor:pointer; text-align:left; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:6px;
}
.quick-tile:hover{border-color:var(--ink);}
.quick-tile .code{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--accent);}
.quick-tile .name{font-family:"Big Shoulders Display",sans-serif; font-weight:600; font-size:16px; text-transform:uppercase;}

/* legend / footer */
.legend{
  border-top:2px solid var(--ink); margin-top:36px; padding-top:14px;
  display:flex; flex-wrap:wrap; gap:22px; font-size:11.5px; color:var(--ink-muted);
  font-family:"IBM Plex Mono",monospace;
}
.legend-item{display:flex; align-items:center; gap:6px;}
.legend-swatch{width:10px; height:10px; border:1px solid currentColor; flex:none;}

@media print{
  .titleblock,.sidebar,.admin-note,.star-btn{display:none !important;}
  .shell{grid-template-columns:1fr;}
  body{background:#fff; color:#000;}
}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;}
  .sidebar{
    position:fixed; top:58px; left:0; bottom:0; width:250px; z-index:39;
    background:var(--paper); transform:translateX(-100%); transition:transform .18s ease;
    border-right:1px solid var(--hairline);
  }
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:flex;}
  .tb-meta{display:none;}
}
</style>
</head>
<body>

<header class="titleblock">
  <div class="titleblock-grid">
    <div class="tb-cell tb-firm">
      <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle sheet index" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="firm-name">Studio Name Architects</div>
      <div class="firm-sub">OFFICE HUB — TEMPLATE</div>
    </div>
    <div class="tb-cell tb-search">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search standards, templates, forms, SOPs, Revit standards…" autocomplete="off" />
      </div>
    </div>
    <div class="tb-cell tb-meta">
      <span class="tb-label">Date</span>
      <span class="val" id="tbDate"></span>
    </div>
    <div class="tb-cell tb-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle color theme" title="Toggle light / dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="printBtn" aria-label="Print current sheet" title="Print">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><rect x="6" y="14" width="12" height="8"/><path d="M6 18H4a1 1 0 01-1-1v-6a1 1 0 011-1h16a1 1 0 011 1v6a1 1 0 01-1 1h-2"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="idx-heading">Sheet Index</div>
    <ul class="idx-list" id="idxList"></ul>
  </nav>

  <main class="main" id="main">
    <div class="sheet-header">
      <div>
        <h1 id="sheetTitle">Home</h1>
        <div class="sheet-sub" id="sheetSub"></div>
      </div>
      <div class="sheet-scale" id="sheetScale">SCALE: N.T.S.<br>REV: TEMPLATE v1.0</div>
    </div>

    <div id="content"></div>

    <div class="legend">
      <div class="legend-item"><span class="legend-swatch" style="border-color:var(--accent); color:var(--accent);"></span> NEW — added this quarter</div>
      <div class="legend-item"><span class="legend-swatch" style="border-color:var(--warn); color:var(--warn);"></span> UPDATED — revised recently</div>
      <div class="legend-item"><span class="legend-swatch" style="border-color:var(--good); color:var(--good);"></span> REQUIRED — mandatory for all projects</div>
      <div class="legend-item">☆ pin a resource to keep it on Home</div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ---------- THEME ---------- */
  var root = document.documentElement;
  var savedTheme = null;
  try { savedTheme = localStorage.getItem("hub-theme"); } catch(e){}
  if (savedTheme === "light" || savedTheme === "dark") root.setAttribute("data-theme", savedTheme);
  document.getElementById("themeToggle").addEventListener("click", function(){
    var current = root.getAttribute("data-theme");
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var effectiveDark = current ? current === "dark" : prefersDark;
    var next = effectiveDark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("hub-theme", next); } catch(e){}
  });

  document.getElementById("tbDate").textContent = new Date().toLocaleDateString(undefined,{year:"numeric",month:"short",day:"2-digit"});
  document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });

  /* ---------- PINS ---------- */
  var pinned = {};
  try { pinned = JSON.parse(localStorage.getItem("hub-pins") || "{}"); } catch(e){ pinned = {}; }
  function savePins(){ try{ localStorage.setItem("hub-pins", JSON.stringify(pinned)); }catch(e){} }

  /* ---------- DATA ---------- */
  var SHEETS = [
    {id:"home",      code:"G-000", name:"Home"},
    {id:"announce",  code:"G-001", name:"Announcements & Reminders"},
    {id:"standards", code:"A-100", name:"Office Standards"},
    {id:"templates", code:"A-200", name:"Templates"},
    {id:"forms",     code:"A-300", name:"Forms"},
    {id:"policies",  code:"A-400", name:"Office Policies"},
    {id:"sops",      code:"A-500", name:"SOPs"},
    {id:"revit",     code:"A-600", name:"Revit Standards"},
    {id:"directory", code:"A-700", name:"Staff Directory"}
  ];

  var SHEET_SUB = {
    home:"Welcome — quick links, pinned resources, and the latest announcements in one place.",
    announce:"Pinned office notices, deadlines, closures, and IT maintenance windows.",
    standards:"Drafting conventions, CAD standards, file naming, and deliverable requirements.",
    templates:"Ready-to-use templates for drawings, correspondence, and project documents.",
    forms:"Fillable forms for HR, IT, expenses, and project administration.",
    policies:"Employee handbook and firm-wide policies.",
    sops:"Step-by-step standard operating procedures for recurring project workflows.",
    revit:"BIM execution standards for model setup, families, views, sheets, and plotting.",
    directory:"Key contacts, department leads, and how to reach IT / HR support."
  };

  // id, sheet, code, title, desc, tags[], format, status(new|updated|required|""), updated, href
  var RESOURCES = [
    // ---- STANDARDS (A-100) ----
    {id:"std1", sheet:"standards", code:"STD-101", title:"Drafting & CAD Standards", desc:"Line weights, layer naming, hatch patterns, and dimensioning conventions for all drawing sets.", tags:["CAD","Drafting"], format:"PDF", status:"required", updated:"2026-06-01"},
    {id:"std2", sheet:"standards", code:"STD-102", title:"File Naming Convention", desc:"Naming structure for drawings, models, and project folders — project no. / discipline / sheet type.", tags:["Files","Naming"], format:"PDF", status:"required", updated:"2026-06-01"},
    {id:"std3", sheet:"standards", code:"STD-103", title:"Sheet Numbering Standard", desc:"Discipline prefixes and sheet sequencing (G / A / S / M / E / P) for construction document sets.", tags:["Sheets"], format:"PDF", status:"required", updated:"2025-11-14"},
    {id:"std4", sheet:"standards", code:"STD-104", title:"Deliverable Standards by Phase", desc:"Required drawing content at SD, DD, CD, and CA phases.", tags:["Deliverables","QA"], format:"Google Doc", status:"", updated:"2025-09-02"},
    {id:"std5", sheet:"standards", code:"STD-105", title:"Plotting & Print Standards", desc:"Pen tables, plot styles, and PDF export settings for consistent hard-copy and digital sets.", tags:["Plotting"], format:"PDF", status:"updated", updated:"2026-07-22"},
    {id:"std6", sheet:"standards", code:"STD-106", title:"Specification Format Guide", desc:"CSI MasterFormat divisions and section formatting used in office specifications.", tags:["Specs"], format:"DOCX", status:"", updated:"2025-05-19"},

    // ---- TEMPLATES (A-200) ----
    {id:"tpl1", sheet:"templates", code:"TPL-201", title:"Sheet Title Block Template", desc:"Standard title block, north arrow, scale bar, and revision cloud blocks for CAD sheets.", tags:["Drawings"], format:"DWG", status:"required", updated:"2026-04-10"},
    {id:"tpl2", sheet:"templates", code:"TPL-202", title:"Meeting Minutes Template", desc:"Standard format for OAC and design meeting minutes with action-item tracking.", tags:["Correspondence"], format:"Google Doc", status:"", updated:"2025-08-11"},
    {id:"tpl3", sheet:"templates", code:"TPL-203", title:"Transmittal Template", desc:"Cover sheet for issuing drawings and documents to consultants, contractors, and clients.", tags:["Correspondence"], format:"DOCX", status:"", updated:"2025-08-11"},
    {id:"tpl4", sheet:"templates", code:"TPL-204", title:"RFI Template", desc:"Request for Information format with numbering convention and response fields.", tags:["Construction Admin"], format:"Google Sheet", status:"", updated:"2025-10-03"},
    {id:"tpl5", sheet:"templates", code:"TPL-205", title:"Punch List Template", desc:"Field punch list with location, trade, and status columns for CA site visits.", tags:["Construction Admin"], format:"Google Sheet", status:"new", updated:"2026-08-01"},
    {id:"tpl6", sheet:"templates", code:"TPL-206", title:"Proposal & Fee Template", desc:"Standard proposal layout with scope, fee table, and standard terms.", tags:["Business Dev"], format:"DOCX", status:"", updated:"2025-12-15"},

    // ---- FORMS (A-300) ----
    {id:"frm1", sheet:"forms", code:"FRM-301", title:"PTO / Time-Off Request", desc:"Request vacation, sick, or personal time for manager approval.", tags:["HR"], format:"Form", status:"required", updated:"2026-01-05"},
    {id:"frm2", sheet:"forms", code:"FRM-302", title:"Expense Reimbursement", desc:"Submit receipts and mileage for reimbursement — reviewed biweekly.", tags:["Finance"], format:"Form", status:"", updated:"2025-07-28"},
    {id:"frm3", sheet:"forms", code:"FRM-303", title:"IT Support Request", desc:"Report hardware, software, or network issues to IT.", tags:["IT"], format:"Form", status:"", updated:"2025-07-28"},
    {id:"frm4", sheet:"forms", code:"FRM-304", title:"New-Hire Onboarding Checklist", desc:"Setup checklist for accounts, licenses, and workstation for new employees.", tags:["HR"], format:"Google Doc", status:"", updated:"2025-04-02"},
    {id:"frm5", sheet:"forms", code:"FRM-305", title:"Project Closeout Checklist", desc:"Archive drawings, close out consultant contracts, and file record documents.", tags:["Project Admin"], format:"Google Sheet", status:"required", updated:"2025-11-30"},
    {id:"frm6", sheet:"forms", code:"FRM-306", title:"Timesheet Correction", desc:"Request a correction to a submitted weekly timesheet.", tags:["HR"], format:"Form", status:"", updated:"2025-06-06"},

    // ---- POLICIES (A-400) ----
    {id:"pol1", sheet:"policies", code:"POL-401", title:"Employee Handbook", desc:"Firm-wide policies covering conduct, benefits, and workplace expectations.", tags:["HR"], format:"PDF", status:"required", updated:"2026-01-15"},
    {id:"pol2", sheet:"policies", code:"POL-402", title:"Jobsite Health & Safety Policy", desc:"PPE requirements and safety protocol for site visits and construction observation.", tags:["Safety"], format:"PDF", status:"required", updated:"2026-03-01"},
    {id:"pol3", sheet:"policies", code:"POL-403", title:"Remote Work Policy", desc:"Eligibility, core hours, and equipment guidelines for remote and hybrid work.", tags:["HR"], format:"PDF", status:"", updated:"2025-09-20"},
    {id:"pol4", sheet:"policies", code:"POL-404", title:"Vehicle & Mileage Policy", desc:"Mileage rate, vehicle use, and reimbursement rules for site visits.", tags:["Finance"], format:"PDF", status:"", updated:"2025-05-11"},
    {id:"pol5", sheet:"policies", code:"POL-405", title:"IT & Software Use Policy", desc:"Acceptable use, licensing, and data-security requirements for office software.", tags:["IT"], format:"PDF", status:"updated", updated:"2026-07-09"},

    // ---- SOPs (A-500) ----
    {id:"sop1", sheet:"sops", code:"SOP-501", title:"Project Kickoff SOP", desc:"Steps to set up a new project: numbering, folder structure, contracts, and team assignment.", tags:["Project Admin"], format:"Google Doc", status:"required", updated:"2026-02-14"},
    {id:"sop2", sheet:"sops", code:"SOP-502", title:"QA/QC Review SOP", desc:"Milestone review checkpoints and sign-off requirements before issuing drawing sets.", tags:["QA"], format:"PDF", status:"required", updated:"2025-10-22"},
    {id:"sop3", sheet:"sops", code:"SOP-503", title:"Submittal Review SOP", desc:"Log, route, and respond to contractor submittals within the review timeline.", tags:["Construction Admin"], format:"Google Doc", status:"", updated:"2025-11-05"},
    {id:"sop4", sheet:"sops", code:"SOP-504", title:"Client Onboarding SOP", desc:"Contract execution, kickoff scheduling, and initial data collection for new clients.", tags:["Business Dev"], format:"Google Doc", status:"", updated:"2025-06-18"},
    {id:"sop5", sheet:"sops", code:"SOP-505", title:"File Backup & Archiving SOP", desc:"Backup cadence and archive procedure for active and closed project files.", tags:["IT"], format:"PDF", status:"", updated:"2025-04-29"},
    {id:"sop6", sheet:"sops", code:"SOP-506", title:"Drawing Issue & Plotting SOP", desc:"Process for issuing drawing sets — internal review, plotting, and transmittal logging.", tags:["Drafting"], format:"PDF", status:"", updated:"2025-09-14"},

    // ---- REVIT STANDARDS (A-600) ----
    {id:"rev1", sheet:"revit", code:"BIM-601", title:"Model Setup & Worksharing Protocol", desc:"Central file location, worksets, sync frequency, and file-naming for shared models.", tags:["Revit","BIM"], format:"PDF", status:"required", updated:"2026-05-20"},
    {id:"rev2", sheet:"revit", code:"BIM-602", title:"Family Library & Naming Standard", desc:"Approved family library location and naming convention for custom families.", tags:["Revit","Families"], format:"PDF", status:"", updated:"2025-12-02"},
    {id:"rev3", sheet:"revit", code:"BIM-603", title:"View Templates & Graphics Standard", desc:"Standard view templates, line styles, and graphic overrides for consistent drawing output.", tags:["Revit","Graphics"], format:"RVT", status:"", updated:"2026-01-30"},
    {id:"rev4", sheet:"revit", code:"BIM-604", title:"Sheet & View Numbering Standard", desc:"View naming and sheet numbering to align with the office sheet-numbering standard.", tags:["Revit","Sheets"], format:"PDF", status:"", updated:"2025-11-14"},
    {id:"rev5", sheet:"revit", code:"BIM-605", title:"Level of Development (LOD) Matrix", desc:"Required LOD by element and project phase, per BIM execution plan.", tags:["Revit","BIM"], format:"Google Sheet", status:"updated", updated:"2026-07-15"},
    {id:"rev6", sheet:"revit", code:"BIM-606", title:"CAD-to-Revit Linking Standard", desc:"Link vs. import rules, shared coordinates, and file cleanup before linking CAD backgrounds.", tags:["Revit","CAD"], format:"PDF", status:"", updated:"2025-08-25"},
    {id:"rev7", sheet:"revit", code:"BIM-607", title:"Keynoting Standard", desc:"Keynote file location and numbering convention for consistent annotation across projects.", tags:["Revit","Annotation"], format:"PDF", status:"", updated:"2025-07-01"},
    {id:"rev8", sheet:"revit", code:"BIM-608", title:"Model Health & Audit Checklist", desc:"Monthly checklist for purging, warnings review, and file-size audit on active models.", tags:["Revit","QA"], format:"Google Sheet", status:"new", updated:"2026-08-05"},

    // ---- DIRECTORY (A-700) ----
    {id:"dir1", sheet:"directory", code:"DIR-701", title:"Org Chart", desc:"Studio leadership, department leads, and reporting structure.", tags:["Directory"], format:"PDF", status:"", updated:"2025-10-01"},
    {id:"dir2", sheet:"directory", code:"DIR-702", title:"IT Help Desk", desc:"Contact info and hours for hardware, software, and network support.", tags:["IT"], format:"Google Doc", status:"", updated:"2025-10-01"},
    {id:"dir3", sheet:"directory", code:"DIR-703", title:"HR Contacts", desc:"Benefits, payroll, and personnel questions — who to contact and when.", tags:["HR"], format:"Google Doc", status:"", updated:"2025-10-01"}
  ];

  var ANNOUNCEMENTS = [
    {title:"Office closed — Labor Day", date:"2026-09-07", priority:"medium", body:"Office closed Monday, September 7. Deadlines falling on this date shift to September 8."},
    {title:"Revit 2027 rollout begins next month", date:"2026-08-25", priority:"medium", body:"IT will begin migrating active projects to Revit 2027 starting mid-September. Watch for your migration window."},
    {title:"New QA/QC checkpoint added before CD issue", date:"2026-08-18", priority:"low", body:"See SOP-502 (QA/QC Review SOP) for the updated milestone review requirement."},
    {title:"Server maintenance — Saturday 8/30, 6–10am", date:"2026-08-28", priority:"low", body:"File server and Revit central files will be unavailable during this window."}
  ];

  var PLACEHOLDER_NOTE = "Replace with your Drive / Docs / Forms link";

  /* ---------- STATE ---------- */
  var state = { sheet:"home", query:"" };

  /* ---------- RENDER: NAV ---------- */
  function renderNav(){
    var list = document.getElementById("idxList");
    list.innerHTML = "";
    SHEETS.forEach(function(s){
      var count = RESOURCES.filter(function(r){ return r.sheet === s.id; }).length;
      var li = document.createElement("li");
      li.className = "idx-item" + (state.sheet === s.id && !state.query ? " active" : "");
      var btn = document.createElement("button");
      btn.innerHTML = '<span class="code mono">'+s.code+'</span><span>'+s.name+'</span>' + (count ? '<span class="idx-count">'+count+'</span>' : "");
      btn.addEventListener("click", function(){
        state.sheet = s.id; state.query = "";
        document.getElementById("searchInput").value = "";
        document.getElementById("sidebar").classList.remove("open");
        render();
      });
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  /* ---------- CARD BUILDER ---------- */
  function highlight(text, q){
    if(!q) return escapeHtml(text);
    var idx = text.toLowerCase().indexOf(q.toLowerCase());
    if(idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0,idx)) + "<mark>" + escapeHtml(text.slice(idx, idx+q.length)) + "</mark>" + escapeHtml(text.slice(idx+q.length));
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function buildCard(r, q){
    var card = document.createElement("article");
    card.className = "card";
    var isPinned = !!pinned[r.id];
    var pillHtml = r.status ? '<span class="pill '+r.status+'">'+r.status+'</span>' : "";
    card.innerHTML =
      '<div class="card-top">' +
        '<span class="doc-code">'+r.code+'</span>' +
        pillHtml +
        '<button class="star-btn'+(isPinned?" pinned":"")+'" data-id="'+r.id+'" aria-label="'+(isPinned?"Unpin":"Pin")+' '+escapeHtml(r.title)+'" title="'+(isPinned?"Unpin":"Pin to Home")+'">' +
          '<svg viewBox="0 0 24 24" fill="'+(isPinned?"currentColor":"none")+'" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/></svg>' +
        '</button>' +
      '</div>' +
      '<h3>'+highlight(r.title, q)+'</h3>' +
      '<p>'+highlight(r.desc, q)+'</p>' +
      '<div class="tag-row">' + r.tags.map(function(t){ return '<span class="tag">'+escapeHtml(t)+'</span>'; }).join("") + '</div>' +
      '<div class="card-footer">' +
        '<span>'+r.format+' · Updated '+r.updated+'</span>' +
        '<a class="open-link" href="#" title="'+PLACEHOLDER_NOTE+'" onclick="return false;">Open ↗</a>' +
      '</div>';
    card.querySelector(".star-btn").addEventListener("click", function(){
      if(pinned[r.id]) delete pinned[r.id]; else pinned[r.id] = true;
      savePins();
      render();
    });
    return card;
  }

  /* ---------- RENDER: CONTENT ---------- */
  function render(){
    renderNav();
    var content = document.getElementById("content");
    content.innerHTML = "";
    var titleEl = document.getElementById("sheetTitle");
    var subEl = document.getElementById("sheetSub");
    var scaleEl = document.getElementById("sheetScale");

    if(state.query){
      var q = state.query;
      var matches = RESOURCES.filter(function(r){
        var hay = (r.title+" "+r.desc+" "+r.tags.join(" ")+" "+r.code).toLowerCase();
        return hay.indexOf(q.toLowerCase()) !== -1;
      });
      titleEl.textContent = "Search Results";
      subEl.textContent = matches.length + ' result' + (matches.length===1?"":"s") + ' for "' + q + '"';
      scaleEl.innerHTML = "SCALE: N.T.S.<br>REV: TEMPLATE v1.0";
      if(matches.length === 0){
        var empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matches. Try a different term, or browse the sheet index.";
        content.appendChild(empty);
      } else {
        var grid = document.createElement("div");
        grid.className = "grid";
        matches.forEach(function(r){ grid.appendChild(buildCard(r, q)); });
        content.appendChild(grid);
      }
      return;
    }

    var sheetMeta = SHEETS.filter(function(s){return s.id===state.sheet;})[0];
    titleEl.textContent = sheetMeta.name;
    subEl.textContent = SHEET_SUB[state.sheet] || "";
    scaleEl.innerHTML = "SHEET: "+sheetMeta.code+"<br>REV: TEMPLATE v1.0";

    if(state.sheet === "home"){
      renderHome(content);
      return;
    }
    if(state.sheet === "announce"){
      renderAnnouncements(content);
      return;
    }

    var items = RESOURCES.filter(function(r){ return r.sheet === state.sheet; });
    var grid2 = document.createElement("div");
    grid2.className = "grid";
    items.forEach(function(r){ grid2.appendChild(buildCard(r, "")); });
    content.appendChild(grid2);
  }

  function renderAnnouncements(content){
    ANNOUNCEMENTS.forEach(function(a){
      var div = document.createElement("div");
      div.className = "announce " + a.priority;
      div.innerHTML =
        '<div class="announce-top"><h4>'+escapeHtml(a.title)+'</h4><span class="announce-date mono">'+a.date+'</span></div>' +
        '<p>'+escapeHtml(a.body)+'</p>';
      content.appendChild(div);
    });
  }

  function renderHome(content){
    var note = document.createElement("div");
    note.className = "admin-note";
    note.innerHTML = "<strong>Admin note —</strong> this is a starter template. Swap in your office name above, then replace each card's placeholder link with your real Drive, Docs, Sheets, or Forms URL. Search and pinning work automatically off the resource list.";
    content.appendChild(note);

    var quickWrap = document.createElement("div");
    quickWrap.className = "home-quick";
    SHEETS.filter(function(s){return s.id!=="home";}).forEach(function(s){
      var t = document.createElement("button");
      t.className = "quick-tile";
      t.innerHTML = '<span class="code mono">'+s.code+'</span><span class="name">'+s.name+'</span>';
      t.addEventListener("click", function(){ state.sheet = s.id; render(); });
      quickWrap.appendChild(t);
    });
    content.appendChild(quickWrap);

    var pinnedIds = Object.keys(pinned);
    if(pinnedIds.length){
      var block = document.createElement("div");
      block.className = "section-block";
      block.innerHTML = "<h2>Pinned</h2>";
      var grid = document.createElement("div");
      grid.className = "grid";
      RESOURCES.filter(function(r){ return pinned[r.id]; }).forEach(function(r){ grid.appendChild(buildCard(r,"")); });
      block.appendChild(grid);
      content.appendChild(block);
    }

    var annBlock = document.createElement("div");
    annBlock.className = "section-block";
    annBlock.innerHTML = "<h2>Latest Announcements</h2>";
    ANNOUNCEMENTS.slice(0,2).forEach(function(a){
      var div = document.createElement("div");
      div.className = "announce " + a.priority;
      div.innerHTML =
        '<div class="announce-top"><h4>'+escapeHtml(a.title)+'</h4><span class="announce-date mono">'+a.date+'</span></div>' +
        '<p>'+escapeHtml(a.body)+'</p>';
      annBlock.appendChild(div);
    });
    content.appendChild(annBlock);

    var reqBlock = document.createElement("div");
    reqBlock.className = "section-block";
    reqBlock.innerHTML = "<h2>Required Reading</h2>";
    var reqGrid = document.createElement("div");
    reqGrid.className = "grid";
    RESOURCES.filter(function(r){ return r.status === "required"; }).slice(0,6).forEach(function(r){ reqGrid.appendChild(buildCard(r,"")); });
    reqBlock.appendChild(reqGrid);
    content.appendChild(reqBlock);
  }

  /* ---------- SEARCH ---------- */
  var searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", function(e){
    state.query = e.target.value.trim();
    render();
  });

  /* ---------- MOBILE MENU ---------- */
  document.getElementById("menuToggle").addEventListener("click", function(){
    var sb = document.getElementById("sidebar");
    var open = sb.classList.toggle("open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });

  render();
})();
</script>
</body>
</html>
